      ${btn(1, inc, "plus", `More ${unit}`)}
    </div></div>`;
}

function PatternControls(d, v, st, r, i) {
  const data = `data-id="${d.id}" data-key="${esc(st.key)}" data-i="${i}"`;
  const uid = `${st.key}-${i}`;
  const locked = !!st.shared;
  const free = freeSegs(v);
  const k = r.pattern.kind;
  const n = k === "every" ? r.pattern.n : 2;
  const g = k === "every" ? r.pattern.group : 1;
  const cost = (kind) => (kind === "every" ? n : 1) - segsOf([r]);
  const kindReason = (kind) => {
    if (kind === k) return "";
    if (locked) return LOCKED;
    if (kind === "every" && r.len < 2) return "Every N needs at least 2 LEDs.";
    return cost(kind) > free ? needMsg(cost(kind), free) : "";
  };
  const toggles = [
    ["all", "All"],
    ["every", "Every N"],
    ["individual", "Individual"],
  ]
  .map(
    ([kind, label]) =>
      `<button type="button" class="${TOGGLE_OUTLINE} h-9 px-3 aria-disabled:cursor-not-allowed aria-disabled:opacity-50" aria-pressed="${k === kind}" data-a="setPattern" ${data} data-kind="${kind}"${reasonAttr(
        kindReason(kind),
      )}>${label}</button>`,
  )
  .join("");
  let steppers = "";
  if (k === "every") {
    const nUp = locked
      ? LOCKED
      : n >= 16
        ? "A range can have at most 16 slots."
        : n * g > 255
          ? `With group ${g}, at most ${Math.floor(255 / g) + 1} slots fit.`
          : free < 1
            ? "No free segments. Remove a range first."
            : "";
    const nDown = locked ? LOCKED : n <= 2 ? "Every N needs at least 2 slots. Use All for one." : "";
    const gUp = locked ? LOCKED : g >= 255 ? "A group can be at most 255 LEDs." : (n - 1) * (g + 1) > 255 ? `With ${n} slots, a group can be at most ${Math.floor(255 / (n - 1))} LEDs.` : "";
    const gDown = locked ? LOCKED : g <= 1 ? "A group is at least 1 LED." : "";
    steppers = `<div class="flex flex-wrap items-end gap-x-6 gap-y-4">
      ${Stepper({ id: `n-${uid}`, label: "N", value: n, dec: nDown, inc: nUp, action: "stepN", data, unit: "slots" })}
      ${Stepper({ id: `g-${uid}`, label: "Group", value: g, dec: gDown, inc: gUp, action: "stepG", data, unit: "LEDs per group" })}
      <p class="${FORM_DESCRIPTION} pb-2.5">LEDs go <span class="font-mono tracking-wide">${everyPreview(n, g)}</span></p>
    </div>`;
  }
  return `<div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2"><span id="pat-${uid}" class="${LABEL}">Pattern</span>
      <div role="group" aria-labelledby="pat-${uid}" class="flex flex-wrap gap-1.5">${toggles}</div></div>
    ${steppers}
  </div>`;
}

function PaintEditor(d, st, r, i) {
  const data = `data-id="${d.id}" data-key="${esc(st.key)}" data-i="${i}"`;
  const uid = `${st.key}-${i}`;
  const cells = Math.min(r.len, S.desktop ? 120 : 48);

  const curLed = Math.floor(cur * per);

  const paint = r.paint ?? [];
  const cellHtml = Array.from({ length: cells }, (_, c) => {
    const a = Math.floor(c * per);
    const b = Math.max(a + 1, Math.floor((c + 1) * per));

  }).join("");

        )}" class="absolute inset-0 h-full w-full cursor-pointer opacity-0" value="${brush.toLowerCase()}" data-in="brushColor"></span>
        <span class="font-mono text-xs font-normal text-muted-foreground">${brush}</span></label>
      <div class="flex gap-1.5" role="group" aria-label="Recent colors">${S.prefs.recentColors
      .slice(0, 6)
      .map(
        (c) =>
          `<button type="button" class="h-6 w-6 rounded-full border border-foreground/15 shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background" style="background:${c}" aria-label="Brush ${esc(
            colorName(c),
          )}" aria-pressed="${c === brush}" data-a="pickBrush" data-hex="${c}"></button>`,
      )
      .join("")}</div>
      <div class="flex gap-2 sm:ml-auto">
        <button type="button" class="${button({ variant: "outline", size: "sm" })}" data-a="paintFill" ${data}>${icon("droplet")}Fill range</button>
        <button type="button" class="${button({ variant: "outline", size: "sm" })}" data-a="paintClear" ${data}>${icon("eraser")}Clear</button>
      </div>

      r.start + curLed
    }, ${esc(colorName(paint[curLed] ?? "#000000"))}" aria-describedby="paint-help-${esc(uid)}" data-drag="paint" data-kbd="paint" data-cells="${cells}" ${data}
      class="group flex h-11 cursor-crosshair touch-none gap-px overflow-hidden rounded-md border bg-black outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background">${cellHtml}</div>
    <p id="paint-help-${esc(uid)}" class="${FORM_DESCRIPTION}">Tap or drag to paint. The lights change when you let go. With a keyboard: arrow keys move, Space paints.</p>
  </div>`;
}

// --- Lights actions ------------------------------------------------------------
A.pickStrand = (el) => {
  S.ui.strand[el.dataset.id] = el.dataset.key;
  render();
};
A.strandPower = (el) => {
  const { id, key } = dsel(el);
  editStrand(id, key, ["on"], (s) => (s.on = !s.on));
};
A.strandBri = (el) => {
  const { id, key } = dsel(el);
  const b = Number(el.value);
  if (strandOf(viewOf(id), key)?.bri === b) return;
  editStrand(id, key, ["bri"], (s) => (s.bri = b));
};
A.toggleRange = (el) => {
  const { id, key, i } = dsel(el);
  const k = `rng:${id}:${key}:${i}`;
  S.ui.open[k] = !(S.ui.open[k] ?? i === 0);
  S.ui.selRange[`${id}|${key}`] = i;
  render();
};
A.setPattern = (el) => {
  const { id, key, i } = dsel(el);
  const kind = el.dataset.kind;
  const r = strandOf(viewOf(id), key).ranges[i];
  if (r.pattern.kind === kind) return;
  const p = kind === "every" ? { kind, n: 2, group: 1 } : { kind };
  editRanges(id, key, (rs) => {
    rs[i] = withPattern(id, rs[i], p);
    return rs;
  });
};
A.stepN = (el) => {
  const { id, key, i } = dsel(el);
  const dir = Number(el.dataset.dir);
  editRanges(id, key, (rs) => {
    const p = rs[i].pattern;
    rs[i] = withPattern(id, rs[i], { kind: "every", n: p.n + dir, group: p.group });
    return rs;
  });
};
A.stepG = (el) => {
  const { id, key, i } = dsel(el);
  const dir = Number(el.dataset.dir);
  editRanges(id, key, (rs) => {
    rs[i].pattern = { ...rs[i].pattern, group: rs[i].pattern.group + dir };
    return rs;
  });
};
A.addRange = (el) => {
  const { id, key, i } = dsel(el);
  const st = strandOf(viewOf(id), key);
  const name = nextRangeName(st.ranges);
  const ok = editRanges(id, key, (rs) => {
    const r = rs[i];
    const half = Math.floor(r.len / 2);
    const a = { ...r, len: half };
    const b = { ...deepClone(r), name, start: r.start + half, len: r.len - half };
    if (r.paint) {
      a.paint = r.paint.slice(0, half);
      b.paint = r.paint.slice(half);
    }
    rs.splice(i, 1, a, b);
    return rs;
  });
  if (ok) {
    S.ui.open[`rng:${id}:${key}:${i + 1}`] = true;
    S.ui.selRange[`${id}|${key}`] = i + 1;
    S.focus = `h-${key}-${i}`;
    toast("info", `Added ${name}`, "Drag the new boundary on the strip to move it.");
  }
};
function mergeInto(id, rs, keep, drop) {
  const a = rs[keep];
  const b = rs[drop];
  const first = Math.min(a.start, b.start);
  if (a.paint) a.paint = keep < drop ? [...a.paint, ...rangeColors(id, b)] : [...rangeColors(id, b), ...a.paint];
  a.start = first;
  a.len += b.len;
  rs.splice(drop, 1);
  return rs;
}
A.mergeNext = (el) => {
  const { id, key, i } = dsel(el);
  editRanges(id, key, (rs) => mergeInto(id, rs, i, i + 1));
};
A.deleteRange = (el) => {
  const { id, key, i } = dsel(el);
  const st = strandOf(viewOf(id), key);
  const r = st.ranges[i];
  const pv = st.ranges[i - 1];
  const intoPrev = pv && pv.start + pv.len === r.start;
  const into = intoPrev ? pv : st.ranges[i + 1];
  if (editRanges(id, key, (rs) => mergeInto(id, rs, intoPrev ? i - 1 : i + 1, i))) toast("info", `Deleted ${r.name}`, `Its LEDs are part of ${into.name} now.`);
};
A.renameRange = (el) => {
  const { id, key, i } = dsel(el);
  const r = strandOf(viewOf(id), key).ranges[i];
  S.modal = { type: "rename", kind: "range", deviceId: id, key, i, name: r.name, title: "Rename range", error: null, busy: false, returnFocus: `range-${key}-${i}-btn` };
  S.focus = "rename-input";
  render();
};
A.renameStrand = (el) => {
  const { id, key } = dsel(el);
  const st = strandOf(viewOf(id), key);
  S.modal = {
    type: "rename",
    kind: "strand",
    deviceId: id,
    key,
    name: st.name,
    title: "Rename strand",
    help: `Leave it empty to go back to the default name. The output is ${pinLabel(st.pins)}.`,
    error: null,
    busy: false,
    returnFocus: `strand-${key}-btn`,
  };
  S.focus = "rename-input";
  render();
};
A.flash = async (el) => {
  const { id, key } = dsel(el);
  const led = Number(el.dataset.led);
  try {
    await api.flash(id, key, led);
  } catch (e) {
    toast("error", "Couldn't flash the LED", e.message);
    return;
  }
  const f = (S.ui.flash = { id, key, led });
  render();
  setTimeout(() => {
    if (S.ui.flash !== f) return;
    S.ui.flash = null;
    render();
  }, 3000);
};
A.resolveShared = async (el) => {
  const { id, key } = dsel(el);
  const action = el.dataset.v;
  const st = strandOf(viewOf(id), key);
  const res = await lightsCall(id, () => api.resolveShared(id, key, action));
  if (!res) return;
  if (action === "combine") S.ui.strand[id] = [key, ...st.shared.with].sort((a, b) => Number(a.slice(1)) - Number(b.slice(1))).join("+");
  toast("success", action === "combine" ? "Strands combined" : "Split by strand", action === "combine" ? "They're one strand now." : "Each strand has its own range now.");
};
A.openCombine = (el) => {
  S.modal = { type: "combine", deviceId: el.dataset.id, pick: 0, busy: false, returnFocus: null };
  S.focus = "pair-0";
  render();
};
A.pickPair = (el) => {
  S.modal.pick = Number(el.dataset.k);
  render();
};
A.confirmCombine = async () => {
  const m = S.modal;
  const v = viewOf(m.deviceId);
  const [a, b] = adjacentPairs(v)[m.pick];
  const key = `${a.key}+${b.key}`;
  const keys = [...v.strands.filter((s) => s.key.includes("+") && s !== a && s !== b).map((s) => s.key), key];
  m.busy = true;
  render();
  const res = await lightsCall(m.deviceId, () => api.putStrandGroups(m.deviceId, keys));
  if (S.modal === m) S.modal = null;
  if (res) {
    S.ui.strand[m.deviceId] = key;
    toast("success", `Combined ${a.name} and ${b.name}`);
  }
  render();
};
A.askSeparate = (el) => {
  const { id, key } = dsel(el);
  S.modal = { type: "separate", deviceId: id, key, busy: false, returnFocus: null };
  render();
};
A.confirmSeparate = async () => {
  const m = S.modal;
  const v = viewOf(m.deviceId);
  const keys = v.strands.filter((s) => s.key.includes("+") && s.key !== m.key).map((s) => s.key);
  m.busy = true;
  render();
  const res = await lightsCall(m.deviceId, () => api.putStrandGroups(m.deviceId, keys));
  if (S.modal === m) S.modal = null;
  if (res) {
    S.ui.strand[m.deviceId] = m.key.split("+")[0];
    toast("success", "Strands separated");
  }
  render();
};
A.brushColor = (el) => {
  S.ui.brush = el.value.toUpperCase();
  render();
};
A.pickBrush = (el) => {
  S.ui.brush = el.dataset.hex;
  render();
};
function fillPaint(el, hex) {
  const { id, key, i } = dsel(el);
  editRanges(id, key, (rs) => {
    rs[i].paint = Array(rs[i].len).fill(hex);
    return rs;
  });
}
A.paintFill = (el) => {
  fillPaint(el, S.ui.brush);
  pushRecent(S.ui.brush);
};
A.paintClear = (el) => fillPaint(el, "#000000");

/** Move the boundary between range i and i + 1 to `led` (snaps to whole LEDs, never crosses a neighbor). */
function moveBoundary(id, key, i, led) {
  const st = strandOf(viewOf(id), key);
  const a = st?.ranges[i];
  const b = st?.ranges[i + 1];
  if (!a || !b || st.shared) return;
  const end = b.start + b.len;
  const pos = Math.max(a.start + 1, Math.min(end - 1, Math.round(led)));
  if (S.ui.drag) S.ui.drag.led = pos;
  if (pos === b.start) return render();
  editRanges(id, key, (rs) => {
    const x = rs[i];
    const y = rs[i + 1];
    const seq = [...(x.paint ?? Array(x.len).fill(null)), ...(y.paint ?? Array(y.len).fill(null))];
    const xLast = x.paint?.at(-1) ?? "#000000";
    const yFirst = y.paint?.[0] ?? "#000000";
    x.len = pos - x.start;
    y.start = pos;
    y.len = end - pos;
    if (x.paint) x.paint = seq.slice(0, x.len).map((c) => c ?? xLast);
    if (y.paint) y.paint = seq.slice(x.len).map((c) => c ?? yFirst);
    return rs;
  });
}

/* =============================================================================
   SLOT EDITOR (<Sheet>: bottom on phones, right side on desktop)
   Color (hue/saturation area, brightness bar, hex, recent colors), effect
   (search, favorites, all effects, the effect's own sliders), palette (only when
   the effect uses one). Every change goes to the lights at once.
   ============================================================================= */
const SHEET_SIDE = "fixed inset-y-0 right-0 z-[80] flex w-full max-w-md flex-col border-l bg-background shadow-xl animate-slide-in-right";
const LIST_ROW =
  "flex min-h-10 w-full min-w-0 items-center gap-2 rounded-md px-2 text-left text-sm hover:bg-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ring aria-pressed:bg-accent aria-pressed:font-medium";

function slotTarget(v, t) {
  if (!v) return null;
  const st = strandOf(v, t.key);
  const r = st?.ranges[t.r];
  const slot = r?.slots[t.s];
  return slot ? { slot, title: r.slots.length > 1 ? `Slot ${t.s + 1} · ${r.name}` : r.name, sub: `${st.name} · ${rangeLabel(r)} · ${patternText(r.pattern)}`, count: r.slots.length } : null;
}
function openSlotSheet(id, target, returnFocus) {
  const t = slotTarget(viewOf(id), target);
  if (!t) return;
  S.modal = { type: "slot", deviceId: id, target, colorIdx: 0, hsv: hexToHsv(hexOf(t.slot.col[0])), hexDraft: null, fxQuery: "", palQuery: "", params: {}, returnFocus };
  S.focus = "slot-close";
  render();
}
A.openSlot = (el) => {
  const { id, key, i } = dsel(el);
  openSlotSheet(id, { kind: "range", key, r: i, s: Number(el.dataset.s) }, el.id);
};

function SlotSheet(m) {
  const t = slotTarget(viewOf(m.deviceId), m.target);
  if (!t) return "";
  const slot = t.slot;
  const fxs = S.cache[`${m.deviceId}:effects`]?.data ?? [];
  const pals = S.cache[`${m.deviceId}:palettes`]?.data ?? [];
  const meta = fxs.find((e) => e.id === slot.fx);
  const colorLabels = meta ? meta.colors : ["Fx"];
  const hex = hsvToHex(m.hsv);
  const hexBad = m.hexDraft !== null && !isHex(m.hexDraft);

  const colorSlots = when(
    colorLabels.length > 1,
    () => `<div role="group" aria-label="Color slot" class="flex flex-wrap gap-1.5">${colorLabels
    .map(
      (l, k) =>
        `<button type="button" class="${TOGGLE_OUTLINE} h-9 gap-2 px-3" aria-pressed="${m.colorIdx === k}" data-a="colorSlotIdx" data-k="${k}"><span aria-hidden="true" class="h-3.5 w-3.5 rounded-full border border-foreground/20" style="background:${hexOf(
          slot.col[k],
        )}"></span>${COLOR_SLOT_LABELS[l] ?? l}</button>`,
    )
    .join("")}</div>`,
  );
  const color =
    colorLabels.length === 0
      ? `<p class="${FORM_DESCRIPTION}">${esc(slot.fxName)} takes its colors from the palette.</p>`
      : `${colorSlots}
      <div id="slot-area" role="slider" tabindex="0" aria-label="Hue and saturation" aria-valuemin="0" aria-valuemax="360" aria-valuenow="${Math.round(m.hsv.h)}" aria-valuetext="Hue ${Math.round(
        m.hsv.h,
      )} degrees, saturation ${Math.round(m.hsv.s * 100)}%" data-drag="color" data-kbd="color"
        class="relative h-36 w-full cursor-crosshair touch-none rounded-md border outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background"
        style="background:linear-gradient(to top,#fff,rgba(255,255,255,0)),linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)">
        <span class="pointer-events-none absolute h-5 w-5 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white shadow-[0_0_0_1px_rgba(0,0,0,.55)]" style="left:${(m.hsv.h / 360) * 100}%;top:${
          (1 - m.hsv.s) * 100
        }%;background:${hsvToHex({ ...m.hsv, v: 1 })}"></span>
      </div>
      <div class="flex items-center gap-3">${icon("sun", "size-4 text-muted-foreground")}${Slider({
        id: "slot-v",
        value: Math.round(m.hsv.v * 100),
        min: 0,
        max: 100,
        label: "Color brightness",
        input: "colorV",
        change: "colorVCommit",
      })}<span class="w-10 shrink-0 text-right text-[13px] tabular-nums text-muted-foreground">${Math.round(m.hsv.v * 100)}%</span></div>
      <div class="flex items-start gap-3">
        <span aria-hidden="true" class="mt-[26px] h-10 w-10 shrink-0 rounded-md border" style="background:${hex}"></span>
        <div class="min-w-0 flex-1">${Field({
          id: "slot-hex",
          label: "Hex",
          control: `<input id="slot-hex" class="${INPUT} font-mono uppercase" value="${esc(m.hexDraft ?? hex)}" maxlength="7" spellcheck="false" autocapitalize="none" autocomplete="off" data-in="hexInput" aria-describedby="slot-hex-msg"${attr(
            hexBad,
            "aria-invalid",
            "true",
          )}>`,
          error: hexBad ? "Enter 6 hex digits, like FF8800." : "",
        })}</div>
      </div>
      <div class="flex flex-col gap-2"><span class="${LABEL}">Recent</span>
        <div class="flex flex-wrap gap-2">${S.prefs.recentColors
        .map(
          (c) =>
            `<button type="button" class="h-8 w-8 rounded-full border border-foreground/15 shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background" style="background:${c}" aria-label="Use ${esc(
              colorName(c),
            )}" data-a="recentColor" data-hex="${c}"></button>`,
        )
        .join("")}</div></div>`;

  const fq = m.fxQuery.trim().toLowerCase();
  const sorted = fxs.filter((e) => !/RSVD/.test(e.name)).sort((a, b) => (a.id === 0 ? -1 : b.id === 0 ? 1 : a.name.localeCompare(b.name)));
  const shown = sorted.filter((e) => !fq || e.name.toLowerCase().includes(fq));
  const favs = shown.filter((e) => S.prefs.favoriteEffects.includes(e.name));
  const fxRow = (e, grp) => {
    const fav = S.prefs.favoriteEffects.includes(e.name);
    return `<li class="flex items-center gap-1">
      <button type="button" id="fx-${grp}-${e.id}" class="${LIST_ROW} flex-1" aria-pressed="${e.id === slot.fx}" data-a="pickFx" data-fx="${e.id}"><span class="flex w-4 shrink-0 justify-center">${when(
        e.id === slot.fx,
        icon("check"),
      )}</span><span class="truncate">${esc(e.name)}</span>${when(e.pal, `<span class="ml-auto" title="Uses a palette">${icon("palette", "size-3.5 text-muted-foreground")}</span>`)}</button>
      <button type="button" id="fav-${grp}-${e.id}" class="${button({ variant: "ghost", size: "icon-sm" })}" aria-pressed="${fav}" aria-label="Favorite ${esc(e.name)}" data-a="favFx" data-name="${esc(
        e.name,

    ? meta.sliders
    .map((label, k) => {
      const f = ["sx", "ix", "c1"][k];

      return `<div class="flex flex-col gap-1"><div class="flex items-baseline justify-between gap-2"><label for="fxp-${f}" class="text-sm font-medium">${esc(label)}</label><span class="text-[13px] tabular-nums text-muted-foreground">${Math.round(
        (val / 255) * 100,
      )}%</span></div>${Slider({ id: `fxp-${f}`, value: val, min: 0, max: 255, label, input: "fxParamDrag", change: "fxParam", data: `data-f="${f}"` })}</div>`;
    })
    .join("") +
      when(
        meta.checks.length,
        () => `<div class="flex flex-wrap gap-x-6 gap-y-3">${meta.checks
        .map((label, k) => {
          const f = ["o1", "o2", "o3"][k];
          return `<label for="fxo-${f}" class="flex min-h-6 cursor-pointer items-center gap-2.5 text-sm"><button type="button" role="checkbox" id="fxo-${f}" class="${CHECKBOX}" aria-checked="${!!slot[
            f
          ]}" data-a="fxCheck" data-f="${f}">${when(slot[f], icon("check", "size-3.5 [stroke-width:3]"))}</button>${esc(label)}</label>`;
        })

            ",",

      )

  return `<div class="${DIALOG_OVERLAY}" data-a="overlayClick"></div>
  <div role="dialog" aria-modal="true" aria-labelledby="slot-title" class="${S.desktop ? SHEET_SIDE : SHEET_BOTTOM}">
    <div class="${SHEET_HEADER}"><h2 id="slot-title" class="text-base font-semibold">${esc(t.title)}</h2><p class="text-sm text-muted-foreground">${esc(t.sub)}</p>
      <button type="button" id="slot-close" class="${DIALOG_CLOSE}" data-a="closeModal" aria-label="Close">${icon("x")}</button></div>

      <section aria-labelledby="slot-color-h" class="flex flex-col gap-3"><h3 id="slot-color-h" class="text-sm font-semibold">Color</h3>${color}</section>
      <section aria-labelledby="slot-fx-h" class="flex flex-col gap-3">
        <h3 id="slot-fx-h" class="text-sm font-semibold">Effect</h3>

        <div class="max-h-72 overflow-y-auto rounded-md border p-1">
          ${when(favs.length, () => `<p class="${GROUP_LABEL}">Favorites</p><ul>${favs.map((e) => fxRow(e, "fav")).join("")}</ul>`)}
          <p class="${GROUP_LABEL}">All effects</p>
          <ul>${shown.map((e) => fxRow(e, "all")).join("")}</ul>
          ${when(!shown.length, `<p class="px-2 py-3 text-sm text-muted-foreground">No effects match “${esc(m.fxQuery)}”.</p>`)}
        </div>
        ${params}

    </div>
    <div class="${SHEET_FOOTER}">

      <button type="button" class="${button({ className: "flex-1" })}" data-a="closeModal">Done</button>
    </div>

}

function editSlot(m, fn) {
  const t = m.target;
  editStrand(m.deviceId, t.key, ["ranges"], (st) => fn(st.ranges[t.r].slots[t.s]));
}
function pushRecent(hex) {
  S.prefs.recentColors = [hex, ...S.prefs.recentColors.filter((c) => c !== hex)].slice(0, 8);
}
function commitColor(hex) {
  const m = S.modal;
  if (!m || m.type !== "slot") return;
  const t = slotTarget(viewOf(m.deviceId), m.target);
  const k = m.colorIdx;
  if (!t || hexOf(t.slot.col[k]) === hex) return;
  editSlot(m, (s) => (s.col[k] = rgbOf(hex)));
  pushRecent(hex);
}
A.colorSlotIdx = (el) => {
  const m = S.modal;
  m.colorIdx = Number(el.dataset.k);
  m.hsv = hexToHsv(hexOf(slotTarget(viewOf(m.deviceId), m.target).slot.col[m.colorIdx]));
  m.hexDraft = null;
  render();
};
A.colorV = (el) => {
  S.modal.hsv = { ...S.modal.hsv, v: Number(el.value) / 100 };
  S.modal.hexDraft = null;
  render();
};
A.colorVCommit = () => commitColor(hsvToHex(S.modal.hsv));
A.hexInput = (el) => {
  const m = S.modal;
  m.hexDraft = el.value;
  if (isHex(el.value)) {
    m.hsv = hexToHsv(normHex(el.value));
    commitColor(normHex(el.value));
  }
  render();
};
A.recentColor = (el) => {
  const m = S.modal;
  m.hsv = hexToHsv(el.dataset.hex);
  m.hexDraft = null;
  commitColor(el.dataset.hex);
};
A.fxQuery = (el) => {
  S.modal.fxQuery = el.value;
  render();
};
A.palQuery = (el) => {
  S.modal.palQuery = el.value;
  render();
};
A.pickFx = (el) => {
  const m = S.modal;
  const meta = (S.cache[`${m.deviceId}:effects`]?.data ?? []).find((e) => e.id === Number(el.dataset.fx));
  if (!meta) return;
  m.params = {};
  if (m.colorIdx >= Math.max(1, meta.colors.length)) m.colorIdx = 0;
  editSlot(m, (s) => {
    s.fx = meta.id;
    s.fxName = meta.name;
  });
};
A.favFx = (el) => {
  const n = el.dataset.name;
  const f = S.prefs.favoriteEffects;
  S.prefs.favoriteEffects = f.includes(n) ? f.filter((x) => x !== n) : [...f, n];
  render();
};
A.fxParamDrag = (el) => {
  S.modal.params[el.dataset.f] = Number(el.value);
  render();
};
A.fxParam = (el) => {
  const f = el.dataset.f;
  const val = Number(el.value);
  delete S.modal.params[f];
  editSlot(S.modal, (s) => (s[f] = val));
};
A.fxCheck = (el) => {
  const f = el.dataset.f;
  editSlot(S.modal, (s) => (s[f] = !s[f]));
};
A.pickPal = (el) => {
  const m = S.modal;
  const p = (S.cache[`${m.deviceId}:palettes`]?.data ?? []).find((x) => x.id === Number(el.dataset.pal));
  if (!p) return;
  editSlot(m, (s) => {
    s.pal = p.id;
    s.palName = p.name;
  });
};
A.applyAllSlots = () => {
  const m = S.modal;
  const t = m.target;
  const src = slotTarget(viewOf(m.deviceId), t).slot;
  const keys = ["fx", "fxName", "sx", "ix", "c1", "c2", "c3", "o1", "o2", "o3", "pal", "palName"];
  let n = 0;
  editStrand(m.deviceId, t.key, ["ranges"], (st) =>
    st.ranges[t.r].slots.forEach((s, k) => {
      if (k === t.s) return;
      keys.forEach((x) => (s[x] = src[x]));
      n++;
    }),
  );
  toast("success", `${src.fxName} is on ${plural(n, "other slot")} too`, "Their colors stay as they were.");
};

/* =============================================================================
   POINTER DRAGS AND KEYBOARD: range boundaries, paint, the color area
   ============================================================================= */
let drag = null;
const clamp01 = (x) => Math.max(0, Math.min(1, x));
function paintAt(e) {
  const g = drag;
  const x = (e.clientX - g.rect.left) / g.rect.width;
  if (x < 0 || x > 1) return;
  const c = Math.min(g.cells - 1, Math.floor(x * g.cells));
  const from = g.last ?? c; // fill the cells a fast drag skipped over
  g.last = c;
  paintCell(g.id, g.key, g.i, Math.min(from, c), g.cells, Math.max(from, c));
  S.ui.cursor[`${g.id}|${g.key}-${g.i}`] = c;
}
function paintCell(id, key, i, c, cells, to = c) {
  const r = strandOf(viewOf(id), key).ranges[i];
  const per = r.len / cells;
  const a = Math.floor(c * per);
  const b = Math.max(a + 1, Math.floor((to + 1) * per));
  for (let k = a; k < b; k++) r.paint[k] = S.ui.brush;
  S.ui.cursor[`${id}|${key}-${i}`] = to;
  render();
}
/** Paint locally first (into a copy of the view), send once on release. */
function beginPaint(id, key) {
  const w = writer(id, key);
  if (!w.base) w.base = viewOf(id);
  w.hold = true;
  setCache(lightsKey(id), deepClone(viewOf(id)));
}
function endPaint(id, key) {
  writer(id, key).hold = false;
  editStrand(id, key, ["ranges"], () => {});
  pushRecent(S.ui.brush);
}
function colorAt(e) {
  const m = S.modal;
  if (!m || m.type !== "slot") return;
  const x = clamp01((e.clientX - drag.rect.left) / drag.rect.width);
  const y = clamp01((e.clientY - drag.rect.top) / drag.rect.height);
  m.hsv = { h: Math.min(359.9, x * 360), s: 1 - y, v: m.hsv.v || 1 };
  m.hexDraft = null;
  render();
}
const DRAG = {
  handle: {
    start(el, e) {
      const strip = el.closest("[data-strip]");
      drag = { ...dsel(el), rect: strip.getBoundingClientRect(), len: Number(strip.dataset.len) };
      S.ui.drag = { id: drag.id, key: drag.key, i: drag.i, led: Number(el.getAttribute("aria-valuenow")) };
      el.focus();
      render();
    },
    move(e) {
      moveBoundary(drag.id, drag.key, drag.i, ((e.clientX - drag.rect.left) / drag.rect.width) * drag.len);
    },
    end() {
      S.ui.drag = null;
      render();
    },
  },
  paint: {
    start(el, e) {
      drag = { ...dsel(el), rect: el.getBoundingClientRect(), cells: Number(el.dataset.cells) };
      beginPaint(drag.id, drag.key);
      el.focus();
      paintAt(e);
    },
    move: (e) => paintAt(e),
    end() {
      endPaint(drag.id, drag.key);
    },
  },
  color: {
    start(el, e) {
      drag = { rect: el.getBoundingClientRect() };
      el.focus();
      colorAt(e);
    },
    move: (e) => colorAt(e),
    end() {
      if (S.modal?.type === "slot") commitColor(hsvToHex(S.modal.hsv));
    },
  },
};
document.addEventListener("pointerdown", (e) => {
  const el = e.target.closest("[data-drag]");
  if (!el || e.button !== 0 || el.getAttribute("aria-disabled") === "true") return;
  const h = DRAG[el.dataset.drag];
  e.preventDefault();
  h.start(el, e);
  const move = (ev) => h.move(ev);
  const up = (ev) => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
    h.end(ev);
    drag = null;
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
});
const KBD = {
  handle(el, e) {
    const dirs = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 };
    const { id, key, i } = dsel(el);
    const now = Number(el.getAttribute("aria-valuenow"));
    let to;
    if (e.key in dirs) to = now + dirs[e.key] * (e.shiftKey ? 10 : 1);
    else if (e.key === "Home") to = Number(el.getAttribute("aria-valuemin"));
    else if (e.key === "End") to = Number(el.getAttribute("aria-valuemax"));
    else return;
    e.preventDefault();
    moveBoundary(id, key, i, to);
  },
  paint(el, e) {
    const { id, key, i } = dsel(el);
    const cells = Number(el.dataset.cells);
    const ck = `${id}|${key}-${i}`;
    const cur = S.ui.cursor[ck] ?? 0;
    const dirs = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 };
    if (e.key in dirs) {
      e.preventDefault();
      S.ui.cursor[ck] = Math.max(0, Math.min(cells - 1, cur + dirs[e.key] * (e.shiftKey ? 10 : 1)));
      render();
    } else if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      beginPaint(id, key);
      paintCell(id, key, i, cur, cells);
      endPaint(id, key);
    }
  },
  color(el, e) {
    const m = S.modal;
    const dh = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    const ds = { ArrowDown: -1, ArrowUp: 1 }[e.key];
    if (!dh && !ds) return;
    e.preventDefault();
    const big = e.shiftKey;
    m.hsv = {
      h: dh ? (m.hsv.h + dh * (big ? 30 : 5) + 360) % 360 : m.hsv.h,
      s: ds ? clamp01(m.hsv.s + ds * (big ? 0.2 : 0.05)) : m.hsv.s,
      v: m.hsv.v || 1,
    };
    m.hexDraft = null;
    commitColor(hsvToHex(m.hsv));
    render();
  },
};
document.addEventListener("keydown", (e) => {
  const menu = e.target.closest?.('[role="menu"]');
  if (menu && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const items = [...menu.querySelectorAll('[role="menuitem"]')];
    const k = items.indexOf(e.target);
    items[(k + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length]?.focus();
    return;
  }
  if (menu && e.key === "Tab") {
    S.ui.menu = null;
    render();
    return;
  }
  const el = e.target.closest?.("[data-kbd]");
  if (el && el.getAttribute("aria-disabled") !== "true") KBD[el.dataset.kbd]?.(el, e);
});

/* =============================================================================
   SCREEN 6: PRESETS TAB ("/devices/:id?tab=presets")
   Scenes (one strand's whole setup) and looks (a pattern with its slots, for
   any range). Stored by Strand per controller, not as WLED presets.
   ============================================================================= */
function strandLabel(v, key) {
  return strandOf(v, key)?.name ?? key.split("+").map((k) => strandOf(v, k)?.name ?? `Strand ${Number(k.slice(1)) + 1}`).join(" + ");
}
function LookSwatches(look) {
  return `<span aria-hidden="true" class="flex shrink-0 items-center -space-x-1.5">${look.slots
  .slice(0, 4)
  .map((s) => `<span class="h-5 w-5 rounded-full border border-foreground/15 ring-2 ring-card" style="background:${hexOf(s.col[0])}"></span>`)
  .join("")}</span>`;
}
function PresetsTab(d) {
  if (!d.online || S.reboot[d.id]) return TabOffline("Presets are");
  const lv = q(lightsKey(d.id), () => api.getLights(d.id));
  const scenes = q(`${d.id}:scenes`, () => api.getScenes(d.id));
  const looks = q(`${d.id}:looks`, () => api.getLooks(d.id));
  const err = [lv, scenes, looks].find((x) => x.status === "error" && !x.data);
  if (err) return LoadError("Couldn't load presets", err.error, "reloadPresets", d.id);
  if (!lv.data || !scenes.data || !looks.data) {
    return `<div class="flex flex-col gap-8" aria-busy="true" aria-label="Loading">${[0, 1]
    .map(() => `<div class="flex flex-col gap-3">${skel("h-5 w-24")}<div class="${CARD} flex flex-col gap-4 p-4">${skel("h-4 w-48")}${skel("h-4 w-40")}</div></div>`)
    .join("")}</div>`;
  }
  const v = lv.data;
  const ROW = "flex flex-wrap items-center gap-x-3 gap-y-2 px-4 py-3";
  const head = (id, title, desc, action, label) => `<div class="flex flex-wrap items-end justify-between gap-3">
    <div class="flex flex-col gap-0.5"><h2 id="${id}" class="text-base font-semibold tracking-tight">${title}</h2><p class="text-[13px] text-muted-foreground">${desc}</p></div>
    <button type="button" id="${action}-btn" class="${button({ variant: "outline", size: "sm" })}" data-a="${action}" data-id="${d.id}">${icon("plus")}${label}</button>
  </div>`;
  const empty = (text) => `<div class="${CARD} ${PANEL_CENTER} border-dashed py-10">${icon("bookmark", "size-5 text-muted-foreground")}<p class="max-w-sm text-sm text-muted-foreground">${text}</p></div>`;
  const sceneRows = scenes.data
  .map((sc) => {
    const st = strandOf(v, sc.strandKey);
    const data = `data-id="${d.id}" data-pid="${sc.id}" data-kind="scene"`;
    const busy = S.ui.applying === sc.id;
    return `<li class="${ROW}">
      <div class="flex min-w-0 flex-1 flex-col gap-0.5"><span class="truncate font-medium">${esc(sc.name)}</span>
        <span class="flex flex-wrap items-center gap-x-2 text-[13px] text-muted-foreground"><span>${esc(strandLabel(v, sc.strandKey))}</span><span aria-hidden="true">·</span><span>${esc(sc.summary)}</span>${when(
          st && st.len !== sc.ledCount,
          `<span class="${badge("warning")}">${icon("triangle-alert")}LED count changed</span>`,
        )}</span></div>
      ${when(!st, `<span class="${badge("danger")}">Strand not found</span>`)}
      <button type="button" class="${button({ variant: "outline", size: "sm", className: "aria-disabled:cursor-not-allowed aria-disabled:opacity-50" })}" data-a="applyScene" ${data}${reasonAttr(
        !st ? "This scene's strand isn't on the controller any more, or those strands aren't combined now." : "",
      )}${busy ? " disabled" : ""}>${busy ? spinner() : icon("play")}Apply</button>
      ${Menu(`scene-${sc.id}`, `${sc.name} options`, [
        { label: "Rename", icon: "pencil", action: "renamePreset", data },
        { label: "Delete", icon: "trash-2", action: "askDeletePreset", data, danger: true },
      ])}
    </li>`;
  })
  .join("");
  const lookRows = looks.data
  .map((lk) => {
    const data = `data-id="${d.id}" data-pid="${lk.id}" data-kind="look"`;
    return `<li class="${ROW}">
      ${LookSwatches(lk.look)}
      <div class="flex min-w-0 flex-1 flex-col gap-0.5"><span class="truncate font-medium">${esc(lk.name)}</span>
        <span class="text-[13px] text-muted-foreground">${esc(patternText(lk.look.pattern))} · ${esc(lk.look.slots.map((s) => s.fxName).filter((x, k, a) => a.indexOf(x) === k).join(", "))}</span></div>
      <button type="button" id="applylook-${lk.id}" class="${button({ variant: "outline", size: "sm" })}" data-a="openApplyLook" ${data}>${icon("play")}Apply to…</button>
      ${Menu(`look-${lk.id}`, `${lk.name} options`, [
        { label: "Rename", icon: "pencil", action: "renamePreset", data },
        { label: "Delete", icon: "trash-2", action: "askDeletePreset", data, danger: true },
      ])}
    </li>`;
  })
  .join("");
  const list = (rows) => `<ul class="${CARD} divide-y">${rows}</ul>`;
  return `<div class="flex flex-col gap-8">
    <section aria-labelledby="scenes-h" class="flex flex-col gap-3">
      ${head("scenes-h", "Scenes", "A strand's whole setup: ranges, patterns, colors, effects, power and brightness.", "openSaveScene", "Save scene…")}
      ${scenes.data.length ? list(sceneRows) : empty("No scenes yet. Save the current strand setup to come back to it.")}
    </section>
    <section aria-labelledby="looks-h" class="flex flex-col gap-3">
      ${head("looks-h", "Looks", "A pattern with its colors and effects. It fits any range, whatever its length.", "openSaveLook", "Save look…")}
      ${looks.data.length ? list(lookRows) : empty("No looks yet. Save a range's colors and effects to use them on any strand.")}
    </section>
  </div>`;
}
A.reloadPresets = (el) => invalidate((k) => k.startsWith(`${el.dataset.id}:`) && /:(lights|scenes|looks)$/.test(k));

async function doApplyScene(id, sc) {
  S.ui.applying = sc.id;
  render();
  const res = await lightsCall(id, () => api.applyScene(id, sc.id));
  S.ui.applying = null;
  if (res) {
    S.ui.strand[id] = sc.strandKey;
    toast("success", `Applied ${sc.name}`, res.warnings.join(" "));
  }
  render();
}
A.applyScene = (el) => {
  const id = el.dataset.id;
  const sc = (S.cache[`${id}:scenes`]?.data ?? []).find((x) => x.id === el.dataset.pid);
  const st = strandOf(viewOf(id), sc?.strandKey);
  if (!sc || !st) return;
  if (st.len !== sc.ledCount) {
    S.modal = { type: "sceneWarn", deviceId: id, scene: sc, strandName: st.name, now: st.len };
    render();
    return;
  }
  doApplyScene(id, sc);
};
A.confirmSceneWarn = () => {
  const m = S.modal;
  S.modal = null;
  doApplyScene(m.deviceId, m.scene);
};
A.openSaveScene = (el) => {
  const id = el.dataset.id;
  const v = viewOf(id);
  S.modal = { type: "saveScene", deviceId: id, name: "", strandKey: selectedStrand(v, id).key, error: null, busy: false, returnFocus: "openSaveScene-btn" };
  S.focus = "preset-name";
  render();
};
A.openSaveLook = (el) => {
  const id = el.dataset.id;
  const v = viewOf(id);
  const st = selectedStrand(v, id);
  const all = [st, ...v.strands.filter((s) => s !== st)].flatMap((s) => s.ranges.map((r, i) => ({ s, r, i })));
  const first = all.find((x) => x.r.pattern.kind !== "individual");
  S.modal = { type: "saveLook", deviceId: id, name: "", target: first ? `${first.s.key}|${first.i}` : "", error: null, busy: false, returnFocus: "openSaveLook-btn" };
  S.focus = "preset-name";
  render();
};
A.modalName = (el) => {
  S.modal.name = el.value;
  S.modal.error = null;
  render();
};
A.modalSelect = (el) => {
  S.modal[el.dataset.f] = el.value;
  render();
};
A.submitScene = async () => {
  const m = S.modal;
  if (!m.name.trim()) {
    m.error = "Give the scene a name.";
    return render();
  }
  m.busy = true;
  render();
  try {
    await api.createScene(m.deviceId, { name: m.name.trim(), strandKey: m.strandKey });
    S.modal = null;
    toast("success", `Saved ${m.name.trim()}`);
    invalidate((k) => k === `${m.deviceId}:scenes`);
  } catch (e) {
    m.busy = false;
    m.error = e.message;
    render();
  }
};
A.submitLook = async () => {

A.confirmApplyLook = async () => {

function presetOf(el) {

A.submitRename = async () => {
  const m = S.modal;
  const name = m.name.trim();
  if (m.kind === "range") {
    const st = strandOf(viewOf(m.deviceId), m.key);
    if (!name) m.error = "A range needs a name.";
    else if (name.length > 64) m.error = "Use 64 characters or fewer.";
    else if (st.ranges.some((r, i) => i !== m.i && r.name === name)) m.error = "Another range on this strand has that name.";
    if (m.error) return render();
    S.modal = null;
    if (m.returnFocus) S.focus = m.returnFocus;
    editRanges(m.deviceId, m.key, (rs) => {
      rs[m.i].name = name;
      return rs;
    });
    return;
  }
  if (m.kind !== "strand" && !name) {
    m.error = "Give it a name.";
    return render();
  }
  m.busy = true;
  render();
  try {
    if (m.kind === "strand") {
      const view = await api.putStrandNames(m.deviceId, { [m.key]: name });
      setCache(lightsKey(m.deviceId), view);
      afterLightsWrite(m.deviceId, view);
    } else if (m.kind === "scene") {
      await api.renameScene(m.deviceId, m.pid, name);
      invalidate((k) => k === `${m.deviceId}:scenes`);
    } else {
      await api.renameLook(m.deviceId, m.pid, name);
      invalidate((k) => k === `${m.deviceId}:looks`);
    }
    S.modal = null;
    if (m.returnFocus) S.focus = m.returnFocus;
  } catch (e) {
    m.busy = false;
    m.error = e.message;
  }
  render();
};

function cutRanges(cfg, st) {

// The Lights and Presets tabs read the device when they open (no polling while open).
const _navigateTabs = navigate;
navigate = function (path, opts) {
  const before = S.path;
  _navigateTabs(path, opts);
  if (S.path !== path || before === path) return;
  const r = route();
  if (r.name !== "device" || r.settings) return;
  const keys = r.tab === "presets" ? [`${r.id}:scenes`, `${r.id}:looks`, lightsKey(r.id)] : [lightsKey(r.id)];
  keys.forEach((k) => S.cache[k] && !S.inflight[k] && (S.cache[k].stale = true));
};

          .join("")}</ul>
          <p class="text-[13px] text-muted-foreground">No reboot needed. The lights may blink once.</p>`,
        actions: `${cancelBtn("Keep editing")}<button type="button" class="${button()}" data-a="confirmLedSave">Save outputs</button>`,
      });

    case "confirmReconnect":
      return Dialog({
        title: "Save and reconnect?",
        description: `Changing Wi-Fi settings may disconnect this device. If the new settings are wrong, the device opens its own access point (${esc(m.apName)}) so you can fix it.`,
        close: false,
        size: "max-w-md",
        body: when(m.alsoReboot, `<p class="text-[13px] text-muted-foreground">The new hostname or static IP takes effect after the next reboot.</p>`),
        actions: `${cancelBtn()}<button type="button" class="${button()}" data-a="confirmReconnectSave">Save &amp; reconnect</button>`,
      });

    case "confirmRebootSave":
      return Dialog({
        title: "These changes apply after a reboot",
        description: "Save now and reboot later, or reboot right away. Lights turn off for about 10 seconds while it restarts.",
        close: false,
        size: "max-w-md",
        actions: `${cancelBtn()}<button type="button" class="${button({ variant: "secondary" })}" data-a="saveNoReboot">Save</button><button type="button" class="${button()}" data-a="saveAndReboot">Save &amp; reboot</button>`,
      });

    case "scan": {
      const busy = !m.nets && !m.error;
      return Dialog({
        title: "Choose a network",
        description: "Networks this device can hear right now.",
        size: "max-w-md",
        body: `<div class="flex items-center justify-between gap-2"><span class="text-[13px] text-muted-foreground" aria-live="polite">${
          m.nets ? `${m.nets.length} networks` : busy ? "Scanning… this takes a few seconds." : ""
        }</span><button type="button" class="${button({ variant: "ghost", size: "sm" })}" data-a="rescan"${busy ? " disabled" : ""}>${icon("rotate-cw", cn("size-4", busy && "animate-spin"))}Scan again</button></div>
          ${when(m.error, `<p class="text-sm text-danger">${esc(m.error)}</p>`)}
          <ul class="-mx-2 flex flex-col">${
            m.nets
              ? m.nets
                  .map((n) => {
                    const fiveG = n.channel > 14;
                    return `<li><button type="button" class="flex min-h-12 w-full items-center gap-3 rounded-md px-2 py-2 text-left hover:bg-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-transparent" data-a="pickNet" data-ssid="${esc(
                      n.ssid,
                    )}"${fiveG ? " disabled" : ""}>
                      ${SignalBars(n.rssi)}
                      <span class="flex min-w-0 flex-1 flex-col"><span class="truncate font-medium">${esc(n.ssid)}</span>
                        <span class="text-xs tabular-nums text-muted-foreground">${fiveG ? "5 GHz · not supported by this chip" : `Channel ${n.channel} · ${n.rssi} dBm`}</span></span>
                      ${n.enc > 0 ? `<span aria-label="Secured">${icon("lock", "size-4 text-muted-foreground")}</span>` : `<span class="text-xs text-muted-foreground">Open</span>`}
                    </button></li>`;
                  })
                  .join("")
              : busy
                ? [0, 1, 2, 3].map(() => `<li class="flex items-center gap-3 px-2 py-3">${skel("h-4 flex-1")}${skel("h-4 w-12")}</li>`).join("")
                : ""
          }</ul>
          <p class="text-[13px] text-muted-foreground">Hidden network? Close this and type its name.</p>`,
      });
    }

    case "output": {
      const f = S.form;
      if (!f || !f.ui.caps) return "";
      const i = f.draft.outs.findIndex((o) => o.key === m.key);
      if (i < 0) return "";
      const errors = ledErrors(f.draft, f.ui.caps);
      const totals = ledTotals(f.draft, f.ui.caps);
      return `<div class="${DIALOG_OVERLAY}" data-a="overlayClick"></div>
      <div role="dialog" aria-modal="true" aria-label="Output ${i + 1}" class="${SHEET_BOTTOM}">
        <div class="${SHEET_HEADER}"><h2 class="text-base font-semibold">Output ${i + 1}</h2><p class="text-sm text-muted-foreground">Changes apply when you save the section.</p>
          <button type="button" class="${DIALOG_CLOSE}" data-a="closeModal" aria-label="Close">${icon("x")}</button></div>
        <div class="flex-1 overflow-y-auto p-4"><fieldset class="m-0 flex min-w-0 flex-col gap-5 border-0 p-0"${f.saving ? " disabled" : ""}>${OutputEditor(i, f, errors, totals, f.saving)}</fieldset></div>
        <div class="${SHEET_FOOTER}"><button type="button" class="${button({ className: "flex-1" })}" data-a="closeModal">Done</button></div>
      </div>`;
    }

    case "copy":
      return Dialog({
        title: "Copy this text",
        description: "Your browser blocked copying. Select the text and copy it with your keyboard, or long-press on a phone.",
        body: `<textarea readonly rows="${Math.min(12, m.text.split("\n").length + 1)}" aria-label="Text to copy" class="w-full rounded-md border bg-muted/40 p-3 font-mono text-xs">${esc(m.text)}</textarea>`,
      });
  }
  return "";
}

// ---------------------------------------------------------------------------
// <Toaster>
// ---------------------------------------------------------------------------
function Toasts() {
  return `<div role="status" aria-live="polite" class="${TOASTER}">${S.toasts
    .map(
      (t) => `<div class="${TOAST}">${icon(
        t.kind === "success" ? "circle-check" : t.kind === "error" ? "triangle-alert" : "info",
        cn("mt-0.5 size-4", t.kind === "success" ? "text-success" : t.kind === "error" ? "text-danger" : "text-muted-foreground"),
      )}<div class="min-w-0 flex-1"><p class="text-sm font-medium">${esc(t.title)}</p>${when(t.desc, `<p class="text-[13px] text-muted-foreground">${esc(t.desc)}</p>`)}</div></div>`,
    )
    .join("")}</div>`;
}

// ---------------------------------------------------------------------------
// Prototype controls (reviewer-only; not part of the product)
// ---------------------------------------------------------------------------
const SIM_STATUS = { online: "Online", offline: "Powered off", rebooting: "Rebooting", reconnecting: "Reconnecting", "ap-mode": "Stuck in AP mode" };

function PrototypePanel() {
  const sims = prototype.sims();
  const flags = prototype.flags();
  const sw = (checked, action, data, label) => `<label class="flex flex-col items-start gap-1.5 text-muted-foreground">${label}${Switch({ checked, action, data, label })}</label>`;
  return `<div class="fixed bottom-[calc(env(safe-area-inset-bottom,0px)+88px)] left-[max(16px,env(safe-area-inset-left,0px))] z-[75] flex flex-col items-start gap-2 md:bottom-[calc(env(safe-area-inset-bottom,0px)+16px)]">
    ${when(
      S.ui.proto,
      () => `<div role="dialog" aria-label="Prototype controls" class="flex max-h-[min(72dvh,640px)] w-[min(22rem,calc(100vw-32px))] flex-col overflow-hidden rounded-lg border-2 border-dashed border-primary/60 bg-popover text-popover-foreground shadow-2xl">
      <div class="flex items-center justify-between gap-2 border-b px-3 py-2">
        <div class="flex flex-col"><span class="text-sm font-semibold">Prototype controls</span><span class="text-xs text-muted-foreground">For reviewers. Not part of the app.</span></div>
        <button type="button" class="${button({ variant: "ghost", size: "icon-sm" })}" data-a="protoToggle" aria-label="Close prototype controls">${icon("x")}</button>
      </div>
      <div class="flex flex-col gap-4 overflow-y-auto p-3">
        <section class="flex flex-col gap-2"><h3 class="text-xs font-medium uppercase tracking-wider text-muted-foreground">Devices on the network</h3>
          ${sims
            .map(
              (s) => `<div class="rounded-md border p-2.5">
              <div class="mb-2 flex flex-wrap items-center gap-2"><span class="text-sm font-medium">${esc(s.name)}</span>${when(!s.added, `<span class="${badge("outline")}">Not added</span>`)}<span class="ml-auto text-xs text-muted-foreground">${SIM_STATUS[s.status]}</span></div>
              <div class="grid grid-cols-3 gap-2 text-xs">
                ${sw(s.status !== "offline" && s.status !== "ap-mode", "protoOnline", `data-mac="${s.mac}"`, "Online")}
                ${sw(s.pinLocked, "protoPin", `data-mac="${s.mac}"`, "PIN lock")}
                ${sw(s.live, "protoLive", `data-mac="${s.mac}"`, "Live data")}
              </div></div>`,
            )
            .join("")}
          <p class="text-xs text-muted-foreground">Settings PINs are 1234.</p>
        </section>
        <div class="${SEPARATOR}"></div>
        <section class="flex flex-col gap-3"><h3 class="text-xs font-medium uppercase tracking-wider text-muted-foreground">Scenarios</h3>
          <div class="flex items-center justify-between gap-3 text-sm">Next Wi-Fi save fails to reconnect${Switch({ checked: flags.failNextWifi, action: "protoFlag", data: 'data-k="failNextWifi"', label: "Next Wi-Fi save fails to reconnect" })}</div>
          <div class="flex items-center justify-between gap-3 text-sm">Discovery finds nothing${Switch({ checked: flags.discoveryEmpty, action: "protoFlag", data: 'data-k="discoveryEmpty"', label: "Discovery finds nothing" })}</div>
          <div class="flex items-center justify-between gap-3 text-sm">Next lights change fails${Switch({ checked: flags.failNextLights, action: "protoFlag", data: 'data-k="failNextLights"', label: "Next lights change fails" })}</div>
        </section>
        <div class="${SEPARATOR}"></div>
        ${ProtoLights()}
        <div class="${SEPARATOR}"></div>
        <div class="flex flex-wrap gap-2">
          <button type="button" class="${button({ variant: "outline", size: "sm" })}" data-a="protoClear">${icon("trash-2")}Empty device list</button>
          <button type="button" class="${button({ variant: "outline", size: "sm" })}" data-a="protoReset">${icon("rotate-ccw")}Reset demo</button>
        </div>
      </div></div>`,
    )}
    <button type="button" class="${button({ variant: "outline", size: "sm", className: "border-dashed border-primary/60 bg-popover shadow-lg" })}" data-a="protoToggle" aria-expanded="${S.ui.proto}">${icon(
      "flask-conical",
    )}<span class="hidden md:inline">Prototype</span><span class="sr-only md:hidden">Prototype controls</span></button>
  </div>`;
}

A.closeModal = () => {
  const m = S.modal;
  if (!m) return;
  if (m.type === "pin") m.reject({ cancelled: true });
  S.modal = null;
  if (m.returnFocus) S.focus = m.returnFocus;
  render();
};
A.overlayClick = (el, e) => {
  if (S.consent) return;
  if (e.target === el) A.closeModal();
};
A.leaveDiscard = () => {
  const to = S.modal.to;
  S.modal = null;
  navigate(to, { force: true });
};
A.confirmReboot = () => {
  const { deviceId, name } = S.modal;
  S.modal = null;
  rebootDevice(deviceId, name);
};
A.confirmRemove = async () => {
  const m = S.modal;
  m.busy = true;
  render();
  try {
    await api.removeDevice(m.deviceId);
    S.modal = null;
    navigate("/", { force: true });
    toast("success", `Removed ${m.name} from Strand`);
    invalidate((k) => k === "devices");
  } catch (e) {
    m.busy = false;
    toast("error", `Couldn't remove ${m.name}`, e.message);
  }
};
A.confirmLedSave = () => doSaveLed();
A.confirmReconnectSave = () => doReconnect();
A.saveNoReboot = () => doSaveNetwork(false);
A.saveAndReboot = () => doSaveNetwork(true);

A.pinInput = (el) => {
  const m = S.modal;
  m.pin = el.value.replace(/\D/g, "").slice(0, 4);
  m.error = null;
  render();
  if (m.pin.length === 4) A.pinSubmit();
};
A.pinSubmit = async () => {
  const m = S.modal;
  if (!m || m.type !== "pin" || m.pin.length !== 4 || m.busy || m.cooldownUntil > Date.now()) return;
  m.busy = true;
  render();
  try {
    await api.unlock(m.deviceId, m.pin);
    S.modal = null;
    invalidate((k) => k === "devices");
    m.resolve();
  } catch (e) {
    m.busy = false;
    m.pin = "";
    if (e.code === "wrong_pin") {
      m.error = "That PIN didn't work.";
      m.cooldownUntil = Date.now() + 3000; // retries allowed after 3 s
      setTimeout(() => {
        if (S.modal === m) S.focus = "pin-input";
        render();
      }, 3050);
    } else m.error = e.message;
    render();
  }
};

const flip = (el) => el.getAttribute("aria-checked") !== "true";
A.protoToggle = () => {
  S.ui.proto = !S.ui.proto;
  render();
};
A.protoOnline = (el) => prototype.setOnline(el.dataset.mac, flip(el));
A.protoPin = (el) => prototype.setPinLocked(el.dataset.mac, flip(el));
A.protoLive = (el) => prototype.setLive(el.dataset.mac, flip(el));
A.protoFlag = (el) => prototype.setFlag(el.dataset.k, flip(el));
function protoDevice() {
  const r = route();
  return r.name === "device" ? prototype.lightsInfo(r.id) && r.id : null;
}
function ProtoLights() {
  const id = protoDevice();
  const li = id ? prototype.lightsInfo(id) : null;
  const ok = id && viewOf(id);
  const dis = (cond) => (cond ? "" : " disabled");
  const btn = (action, ic, label, enabled) => `<button type="button" class="${button({ variant: "outline", size: "sm" })}" data-a="${action}"${dis(enabled)}>${icon(ic)}${label}</button>`;
  return `<section class="flex flex-col gap-3"><h3 class="text-xs font-medium uppercase tracking-wider text-muted-foreground">Lights (device on screen)</h3>
    ${when(!ok, `<p class="text-xs text-muted-foreground">Open a device's Lights tab to use these.</p>`)}
    <div class="flex flex-wrap gap-2">
      ${btn("protoForeign", "plus", "Add a foreign segment", ok)}
      ${btn("protoShared", "layers", "One segment across strands", ok && li.uncombined > 1 && !li.shared)}
      ${btn("protoAskBoot", "rotate-ccw", "Ask about boot preset again", ok && li.bootPreset && li.consent !== null)}
    </div>
    <div class="flex items-center justify-between gap-3 text-sm">Fill the segment budget${Switch({ checked: !!li?.hidden, action: "protoFill", label: "Fill the segment budget", disabled: !ok })}</div>
    <p class="text-xs text-muted-foreground">Backyard boots its own WLED preset, so its first change asks about the startup preset. These re-read the Lights tab, as opening it would.</p>
  </section>`;
}
function protoLights(fn) {
  const id = protoDevice();
  if (!id) return;
  fn(id);
  invalidate((k) => k === lightsKey(id));
}
A.protoForeign = () => protoLights((id) => prototype.addForeignSegment(id, selectedStrand(viewOf(id), id).key));
A.protoShared = () => protoLights((id) => prototype.shareSegment(id));
A.protoFill = (el) => protoLights((id) => prototype.fillBudget(id, flip(el)));
A.protoAskBoot = () => protoLights((id) => prototype.resetConsent(id));
A.protoClear = () => {
  prototype.clearDevices();
  navigate("/", { force: true });
};
A.protoReset = () => {
  prototype.reset();
  S.cache = {};
  S.form = null;
  S.reconnect = null;
  S.reboot = {};
  S.consent = null;
  S.ui.strand = {};
  navigate("/", { force: true });
};
/* =============================================================================
   BOOT
   ============================================================================= */
applyTheme();
prototype.subscribe(() => invalidate(isLiveKey)); // the "server" pushed a change
setInterval(() => invalidate((k) => k === "devices"), 15000); // device list refresh
matchMedia("(min-width: 900px)").addEventListener("change", (e) => {
  S.desktop = e.matches;
  render();
});
matchMedia("(prefers-color-scheme: light)").addEventListener("change", render);
// Live clocks: System uptime, reconnect timer, PIN cooldown, prototype panel status.
setInterval(() => {
  const r = route();
  if ((r.name === "device" && r.section === "system") || S.reconnect?.phase === "reconnecting" || S.modal?.type === "pin" || S.ui.proto) render();
}, 1000);
setInterval(render, 5000); // lets time-based refreshes (info every 5–10 s) kick in
render();
</script>
