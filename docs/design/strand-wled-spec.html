<title>Strand for WLED</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  Strand for WLED: device setup & settings, interactive design spec (round 1)

  One file, no build step: HTML + Tailwind (Play CDN) + vanilla JS. Open it in a browser.
  - Theme: shadcn/ui CSS variables in the <style> block, mapped to Tailwind colors in tailwind.config
    exactly as a shadcn project does it (background, card, primary, muted, border, ring…).
  - Components: the "SHADCN/UI CLASS STRINGS" block holds the Tailwind classes each shadcn component
    renders (button variants and sizes, Card, Badge, Input, Switch, Slider, Tabs, Dialog, Sheet…).
    Markup uses those strings, so styles transfer 1:1 into a shadcn + Tailwind codebase.
  - Screens: one render function per screen/section, returning HTML for the current state.
  - Mock app server: `api` (latency, offline devices, PIN lock, reboot, Wi-Fi reconnect).
  - Prototype controls (bottom-left) force scenarios for review; they are not part of the product.
  Dependencies: Tailwind Play CDN 3.4.17 and morphdom (patches the DOM between renders).
-->

    onBeforeElUpdated: (from, to) => !from.isEqualNode(to),
  });
  if (S.focus) {
    const el = document.getElementById(S.focus);
    S.focus = null;
    if (el) el.focus();
  }
}

// ---------------------------------------------------------------------------
// Data loading: a tiny query cache (stands in for TanStack Query)
// ---------------------------------------------------------------------------
function q(key, fn, { enabled = true, ttl = 0 } = {}) {
  let e = S.cache[key];
  if (!enabled) return e ? { ...e, fetching: false } : { status: "idle" };
  if (!e) e = S.cache[key] = { status: "loading", stale: true, at: 0 };
  const expired = ttl && Date.now() - e.at > ttl;
  if ((e.stale || expired) && !S.inflight[key]) {
    S.inflight[key] = true;
    e.stale = false;
    Promise.resolve()
      .then(fn)
      .then(
        (data) => (S.cache[key] = { status: "ok", data, at: Date.now(), stale: false }),
        (error) => (S.cache[key] = { status: "error", data: S.cache[key]?.data, error, at: Date.now(), stale: false }),
      )
      .finally(() => {
        delete S.inflight[key];
        render();
      });
  }
  return { ...e, fetching: !!S.inflight[key] };
}
function setCache(key, data) {
  S.cache[key] = { status: "ok", data, at: Date.now(), stale: false };
}
function invalidate(test) {
  for (const k of Object.keys(S.cache)) if (test(k)) S.cache[k].stale = true;
  render();
}
const isLiveKey = (k) => k === "devices" || /:(info|state|pending)$/.test(k);

// ---------------------------------------------------------------------------
// Routing
// ---------------------------------------------------------------------------
function route() {
  const [path, qs = ""] = S.path.split("?");
  const parts = path.split("/").filter(Boolean);
  if (parts[0] === "add") return { name: "add" };
  if (parts[0] === "devices" && parts[1]) {
    return {
      name: "device",
      id: parts[1],
      settings: parts[2] === "settings",
      section: parts[3] ?? null,
      tab: new URLSearchParams(qs).get("tab") ?? "control",
    };
  }
  return { name: "home" };
}
function navigate(path, { force = false } = {}) {
  const leavingPath = S.path.split("?")[0] !== path.split("?")[0];
  if (!force && leavingPath && S.form && formDirty(S.form)) {
    S.modal = { type: "leave", to: path };
    render();
    return;
  }
  if (leavingPath) S.form = null;
  if (path === "/add") resetAddPage(); // discovery runs fresh every time the page opens
  S.path = path;
  S.ui.themeMenu = false;
  window.scrollTo(0, 0);
  render();
}

// ---------------------------------------------------------------------------
// Settings forms: one draft at a time, seeded from server data
// ---------------------------------------------------------------------------
function useForm(key, init, proj = (d) => d) {
  if (!S.form || S.form.key !== key) {
    const base = init();
    S.form = { key, base, draft: deepClone(base), proj, saving: false, ui: {} };
  }
  S.form.proj = proj;
  return S.form;
}
function formDirty(f) {
  return !!f && !same(f.proj(f.draft), f.proj(f.base));
}
function updateDraft(fn) {
  if (!S.form) return;
  S.form.draft = fn(S.form.draft);
  render();
}
function setPath(obj, path, value) {
  const keys = path.split(".");
  const next = deepClone(obj);
  let cur = next;
  keys.slice(0, -1).forEach((k) => (cur = cur[k]));
  cur[keys.at(-1)] = value;
  return next;
}

/** PATCH one section; on 401 pin_required ask for the PIN, unlock, retry. */
async function saveSection(deviceId, label, patch, { quiet = false } = {}) {
  if (S.form) S.form.saving = true;
  render();
  try {
    await withPin(deviceId, () => api.patchConfig(deviceId, patch));
    const fresh = await api.getConfig(deviceId);
    setCache(`${deviceId}:config`, fresh);
    invalidate((k) => k === "devices" || k === `${deviceId}:info` || k === `${deviceId}:pending`);
    if (!quiet) toast("success", `${label} saved`);
    return fresh;
  } catch (e) {
    if (e && e.cancelled) toast("info", "Not saved. The device's settings are still locked.", "Your changes are still here.");
    else toast("error", `Couldn't save ${label}`, `${e.message} Your changes are still here.`);
    return null;
  } finally {
    if (S.form) S.form.saving = false;
    render();
  }
}

async function withPin(deviceId, fn) {
  try {
    return await fn();
  } catch (e) {
    if (e instanceof ApiError && e.code === "pin_required") {
      await askPin(deviceId);
      return await fn();
    }
    throw e;
  }
}
function askPin(deviceId) {
  return new Promise((resolve, reject) => {
    S.modal = { type: "pin", deviceId, pin: "", error: null, busy: false, cooldownUntil: 0, resolve, reject };
    S.focus = "pin-input";
    render();
  });
}

// ---------------------------------------------------------------------------
// Toasts
// ---------------------------------------------------------------------------
let toastId = 0;
function toast(kind, title, desc = "") {
  const id = ++toastId;
  S.toasts = [...S.toasts.slice(-2), { id, kind, title, desc }];
  render();
  setTimeout(() => {
    S.toasts = S.toasts.filter((t) => t.id !== id);
    render();
  }, 4200);
}

// ---------------------------------------------------------------------------
// Reboot watching (shared by System and the "Reboot now" banner)
// ---------------------------------------------------------------------------
async function rebootDevice(id, name) {
  try {
    await api.reboot(id);
  } catch (e) {
    toast("error", `Couldn't reboot ${name}`, e.message);
    return;
  }
  const started = Date.now();
  S.reboot[id] = { started };
  render();
  let seenDown = false;
  const poll = async () => {
    try {
      const info = await api.getInfo(id);
      if (seenDown || Date.now() - started > 3000) {
        delete S.reboot[id];
        setCache(`${id}:info`, info);
        invalidate((k) => (k.startsWith(id) && !k.endsWith(":info")) || k === "devices");
        toast("success", `${name} is back online`);
        return;
      }
    } catch {
      seenDown = true;
      if (Date.now() - started > 60000) {
        delete S.reboot[id];
        toast("error", `${name} hasn't come back after rebooting`, "Give it another minute, then check its power supply.");
        render();
        return;
      }
    }
    setTimeout(poll, 2000);
  };
  setTimeout(poll, 1500);
}

/** Generic field binding: data-in="field" data-path="def.bri" data-type="int|float|str|bool". */
function readValue(el) {
  const t = el.dataset.type;
  if (el.type === "checkbox") return el.checked;
  if (t === "int") return /^\s*\d+\s*$/.test(el.value) ? Number(el.value) : el.value.trim() === "" ? null : NaN;
  if (t === "num") return Number(el.value);
  return el.value;
}
A.field = (el) => updateDraft((d) => setPath(d, el.dataset.path, readValue(el)));
A.toggleField = (el) => updateDraft((d) => setPath(d, el.dataset.path, el.getAttribute("aria-checked") !== "true"));

      ${when(list && list.length, () => `<p class="text-[13px] tabular-nums text-muted-foreground">${list.filter((d) => d.online).length} of ${list.length} online</p>`)}
    </div>
    ${body}
  </main>`;
}

function OnlineCard(d) {
  const s = q(`${d.id}:state`, () => api.getState(d.id)).data;
  const bri = S.ui.bri[d.id] ?? s?.bri ?? 128;
  return `<article class="${DEVICE_CARD}">
    <div class="flex items-center gap-3 p-4 pb-3">
      ${Lamp({ on: s?.on, bri, online: true })}
      <div class="flex min-w-0 flex-1 flex-col gap-0.5">
        <div class="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-1">
          <a href="#/devices/${d.id}" data-nav="/devices/${d.id}" class="${CARD_LINK}">${esc(d.name)}</a>
          ${when(d.pinLocked, `<span class="relative z-10">${LockBadge()}</span>`)}
        </div>
        <div class="flex min-w-0 flex-wrap items-center gap-x-3 gap-y-0.5">${StatusText(d)}<span class="truncate font-mono text-xs text-muted-foreground">${esc(d.host)}</span></div>
      </div>
      <div class="relative z-10">${
        s ? Switch({ checked: s.on, label: `Turn ${d.name} ${s.on ? "off" : "on"}`, action: "power", data: `data-id="${d.id}"` }) : skel("h-6 w-11 rounded-full")
      }</div>
    </div>
    <div class="relative z-10 mx-4 mb-3 flex items-center gap-3">
      ${icon("sun", cn("size-4", s?.on ? "text-foreground" : "text-muted-foreground"))}
      ${s ? Slider({ value: bri, label: `${d.name} brightness`, input: "briDrag", change: "briCommit", data: `data-id="${d.id}"` }) : skel("h-1.5 flex-1")}
      <span class="w-10 shrink-0 text-right text-[13px] tabular-nums text-muted-foreground">${s ? `${briToPct(bri)}%` : ""}</span>
    </div>
  </article>`;
}

function OfflineCard(d) {
  const busy = S.ui.retrying === d.id;
  return `<article class="${cn(DEVICE_CARD, "bg-card/50")}">
    <div class="flex items-center gap-3 p-4">
      ${Lamp({ on: false, bri: 0, online: false, dim: true })}
      <div class="flex min-w-0 flex-1 flex-col gap-0.5">
        <div class="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-1">
          <a href="#/devices/${d.id}" data-nav="/devices/${d.id}" class="${cn(CARD_LINK, "text-muted-foreground")}">${esc(d.name)}</a>
          ${when(d.pinLocked, `<span class="relative z-10">${LockBadge()}</span>`)}
        </div>
        <div class="flex min-w-0 flex-wrap items-center gap-x-3 gap-y-0.5">${StatusText(d)}<span class="truncate font-mono text-xs text-muted-foreground">${esc(d.host)}</span></div>
      </div>
      <button type="button" class="${button({ variant: "outline", size: "sm", className: "relative z-10" })}" data-a="retry" data-id="${d.id}"${busy ? " disabled" : ""}>${
        busy ? spinner() : icon("rotate-cw")
      }Retry</button>
      ${icon("chevron-right", "hidden size-4 text-muted-foreground sm:block")}
    </div>
  </article>`;
}

async function patchLight(id, patch) {
  const key = `${id}:state`;
  const prev = S.cache[key]?.data;
  if (prev) setCache(key, { ...prev, ...patch }); // optimistic
  render();
  try {
    setCache(key, await api.patchState(id, patch));
  } catch (e) {
    if (prev) setCache(key, prev);
    toast("error", "Couldn't change the lights", e.message);
  }
  render();
}
A.power = (el) => patchLight(el.dataset.id, { on: el.getAttribute("aria-checked") !== "true" });
A.briDrag = (el) => {
  S.ui.bri[el.dataset.id] = Number(el.value);
  render();
};
A.briCommit = (el) => {
  const id = el.dataset.id;
  delete S.ui.bri[id];
  patchLight(id, { bri: Number(el.value), on: true }); // moving brightness also turns the lights on
};
A.retry = async (el) => {
  const id = el.dataset.id;
  const name = (S.cache.devices?.data ?? []).find((d) => d.id === id)?.name ?? "The device";
  S.ui.retrying = id;
  render();
  try {
    await api.getInfo(id);
    toast("success", `${name} is back online`);
  } catch {
    toast("error", `${name} still isn't responding`, "Check that it has power and is in range of your Wi-Fi.");
  }
  S.ui.retrying = null;
  invalidate((k) => k === "devices" || k.startsWith(id));
};

// ---------------------------------------------------------------------------
// Add device
// ---------------------------------------------------------------------------
function resetAddPage() {
  delete S.cache.discovery;
  S.ui.adding = null;
  S.ui.manual = { host: "", busy: false, error: null, found: null };
}

function AddPage() {
  const disc = q("discovery", api.discover);
  const scanning = disc.fetching || disc.status === "loading";
  const results = disc.data ?? [];
  const m = S.ui.manual;
  return `${Header()}<main class="${page({ max: "max-w-3xl", pt: "pt-4", extra: "flex flex-col gap-8" })}">
    <div class="flex flex-col gap-3">
      <a href="#/" data-nav="/" class="${BACK_LINK} self-start">${icon("arrow-left")}Devices</a>
      <h1 class="text-xl font-semibold tracking-tight">Add a device</h1>
    </div>

    <section aria-labelledby="found-h" class="flex flex-col gap-3">
      <div class="flex items-center justify-between gap-3">
        <div class="flex flex-col gap-0.5"><h2 id="found-h" class="text-sm font-semibold">On your network</h2>
          <p class="text-[13px] text-muted-foreground" aria-live="polite">${scanning ? "Looking for WLED controllers…" : `${results.length} found`}</p></div>
        <button type="button" class="${button({ variant: "outline", size: "sm" })}" data-a="scanAgain"${scanning ? " disabled" : ""}>${icon(
          "rotate-cw",
          cn("size-4", scanning && "animate-spin"),
        )}Scan again</button>
      </div>
      ${
        scanning
          ? `<div class="flex flex-col gap-2">${[0, 1, 2]
              .map(() => `<div class="${CARD} flex items-center gap-3 p-4"><div class="flex flex-1 flex-col gap-2">${skel("h-4 w-28")}${skel("h-3 w-56 max-w-full")}</div>${skel("h-9 w-16")}</div>`)
              .join("")}</div>`
          : results.length === 0
            ? `<div class="${CARD} flex gap-3 p-4">${icon("wifi-off", "mt-0.5 size-5 text-muted-foreground")}<div class="flex flex-col gap-1">
                <p class="font-medium">No devices found</p>
                <p class="text-[13px] text-muted-foreground">Discovery only finds controllers on the same network as the Strand server. If your device is on another network or VLAN, add it by address below.</p></div></div>`
            : `<ul class="flex flex-col gap-2">${results.map((d) => `<li>${ResultCard(d, "Add")}</li>`).join("")}</ul>`
      }
    </section>

    <section class="${CARD}">
      <div class="${CARD_HEADER}"><div class="flex flex-col gap-1"><h2 class="text-sm font-semibold leading-tight tracking-tight">Add by address</h2>
        <p class="${CARD_DESCRIPTION}">An IP address or hostname like wled-porch.local, for devices discovery can't see.</p></div></div>
      <div class="flex flex-col gap-3 p-4 pt-0 sm:p-5 sm:pt-0">
        <form class="flex flex-col gap-2" data-submit="probe" novalidate>
          <label for="manual-host" class="${LABEL}">Hostname or IP</label>
          <div class="flex flex-col gap-2 sm:flex-row">
            <input id="manual-host" class="${INPUT} font-mono" value="${esc(m.host)}" placeholder="192.168.1.90" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="url"
              data-in="manualHost" aria-describedby="manual-host-msg"${attr(m.error, "aria-invalid", "true")}${m.busy ? " disabled" : ""}>
            <button type="submit" class="${button({ variant: "secondary", className: "sm:w-32" })}"${m.busy ? " disabled" : ""}>${m.busy ? `${spinner()}Checking…` : "Check"}</button>
          </div>
          <p id="manual-host-msg" role="alert" class="${FORM_MESSAGE}">${esc(m.error ?? "")}</p>
        </form>
        ${when(m.found, () => ResultCard(m.found, "Add this device"))}
      </div>
    </section>
  </main>`;
}

function ResultCard(d, label) {
  const busy = S.ui.adding === d.mac;
  return `<div class="${cn(CARD, d.alreadyAdded && "bg-card/50")}"><div class="flex items-center gap-3 p-4">
    <div class="flex min-w-0 flex-1 flex-col gap-1">
      <div class="flex flex-wrap items-center gap-2"><span class="${cn("font-semibold", d.alreadyAdded && "text-muted-foreground")}">${esc(d.name)}</span>
        ${when(d.alreadyAdded, `<span class="${badge("outline")}">${icon("check")}Added</span>`)}</div>
      <p class="flex flex-wrap gap-x-2 text-[13px] tabular-nums text-muted-foreground">
        <span class="font-mono">${esc(d.ip)}</span><span aria-hidden="true">·</span><span>WLED ${esc(d.ver)}</span><span aria-hidden="true">·</span><span>${d.ledCount} LEDs</span><span aria-hidden="true">·</span><span>${archLabel(d.arch)}</span>
      </p>
      ${when(
        d.name === "WLED" && !d.alreadyAdded,
        `<p class="flex items-center gap-1.5 text-[13px] text-muted-foreground">${icon("info", "size-3.5")}Still has its factory name. You can rename it after adding.</p>`,
      )}
    </div>
    ${when(
      !d.alreadyAdded,
      `<button type="button" class="${button({ size: "sm" })}" data-a="addDevice" data-host="${esc(d.host)}" data-mac="${d.mac}" aria-label="${esc(label)} ${esc(d.name)}"${
        S.ui.adding ? " disabled" : ""
      }>${busy ? spinner() : icon("plus")}${label}</button>`,
    )}
  </div></div>`;
}

A.scanAgain = () => invalidate((k) => k === "discovery");
A.manualHost = (el) => {
  S.ui.manual = { ...S.ui.manual, host: el.value, error: null };
  render();
};
A.probe = async () => {
  const m = S.ui.manual;
  if (!m.host.trim()) {
    S.ui.manual = { ...m, error: "Enter a hostname or IP address." };
    return render();
  }
  S.ui.manual = { ...m, busy: true, error: null, found: null };
  render();
  try {
    S.ui.manual = { ...S.ui.manual, busy: false, found: await api.probeHost(m.host) };
  } catch (e) {
    S.ui.manual = { ...S.ui.manual, busy: false, error: e.message };
  }
  render();
};
A.addDevice = async (el) => {
  S.ui.adding = el.dataset.mac;
  render();
  try {
    const dev = await api.addDevice(el.dataset.host);
    navigate("/");
    toast("success", `Added ${dev.name}`, dev.name === "WLED" ? "Give it a name in Settings › Device." : "");
    invalidate((k) => k === "devices");
  } catch (e) {
    toast("error", "Couldn't add that device", e.message);
  }
  S.ui.adding = null;
  render();
};
/* =============================================================================
   SCREEN 3: DEVICE PAGE ("/devices/:id")
   SCREEN 4: SETTINGS OVERVIEW ("/devices/:id/settings")
   SECTIONS: Device · System · Advanced  (LED Hardware, Network, Sync: own blocks)
   ============================================================================= */

const BANNER = "flex flex-wrap items-center gap-3 rounded-lg border p-3";
const PANEL_CENTER = "flex flex-col items-center gap-3 px-6 py-14 text-center";

function DevicePage(r) {
  const devs = q("devices", api.listDevices, { ttl: 15000 });
  if (!devs.data) {
    return `${Header()}<main class="${page({ pt: "pt-6", extra: "flex flex-col gap-2" })}">${skel("h-8 w-24")}${skel("h-7 w-48")}${skel("h-4 w-40")}</main>`;
  }
  const d = devs.data.find((x) => x.id === r.id);
  if (!d) {
    return `${Header()}<main class="${page({ pt: "pt-10" })}"><div class="${CARD} flex flex-col items-start gap-3 p-6">
      <h1 class="text-lg font-semibold">This device isn't in Strand</h1>
      <p class="text-sm text-muted-foreground">It may have been removed. Add it again from the device list.</p>
      <a href="#/" data-nav="/" class="${button({ variant: "outline" })}">Back to devices</a></div></main>`;
  }
  const rebooting = !!S.reboot[d.id];
  const online = d.online && !rebooting;
  const info = q(`${d.id}:info`, () => api.getInfo(d.id), { enabled: online, ttl: 10000 });
  const tab = r.settings ? "settings" : r.tab;
  const tabs = [
    ["control", "palette", "Control", `/devices/${d.id}`],
    ["segments", "layers", "Segments", `/devices/${d.id}?tab=segments`],
    ["presets", "bookmark", "Presets", `/devices/${d.id}?tab=presets`],
    ["settings", "settings-2", "Settings", `/devices/${d.id}/settings`],
  ];

  return `${Header()}<main class="${page({ pt: "pt-3" })}">
    <a href="#/" data-nav="/" class="${BACK_LINK} mb-2">${icon("arrow-left")}Devices</a>

    <div class="flex items-start gap-4">
      <div class="flex min-w-0 flex-1 flex-col gap-1.5">
        <div class="flex flex-wrap items-center gap-2">
          <h1 class="truncate text-2xl font-semibold tracking-tight">${esc(d.name)}</h1>
          ${when(
            d.pinLocked,
            `<button type="button" class="${badge("info", "cursor-pointer")}" data-a="unlock" data-id="${d.id}" title="Enter the PIN to unlock settings for 15 minutes">${icon("lock")}Settings locked</button>`,
          )}
        </div>
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          ${rebooting ? `<span class="inline-flex items-center gap-2 text-[13px] text-muted-foreground">${spinner("size-3.5")}Rebooting…</span>` : StatusText(d)}
          <span class="font-mono text-xs text-muted-foreground">${esc(d.host)}</span>
        </div>
      </div>
      ${when(online, () => HeaderPower(d))}
    </div>

    <div class="mt-4 flex flex-col gap-3">
      ${when(!d.online && !rebooting, () => OfflineBanner(d))}
      ${when(
        online && info.data?.live,
        `<div class="flex gap-3 rounded-lg border border-warning/40 bg-warning-muted p-3 text-sm">${icon("radio", "mt-0.5 size-4 text-warning")}<p>Receiving live data from another source. Changes may not be visible until it stops.</p></div>`,
      )}
      ${when(online, () => PendingRebootBanner(d))}
    </div>

    <nav role="tablist" aria-label="Device views" class="${TABS_LIST} mt-5">
      ${tabs
        .map(([id, ic, label, path]) => `<a role="tab" href="#${path}" data-nav="${path}" aria-selected="${tab === id}" class="${TABS_TRIGGER}">${icon(ic)}${label}</a>`)
        .join("")}
    </nav>

    <div class="mt-5">${r.settings ? SettingsView(r, d) : Placeholder(tab)}</div>
  </main>`;
}

function HeaderPower(d) {
  const s = q(`${d.id}:state`, () => api.getState(d.id)).data;
  if (!s) return skel("mt-1 h-6 w-11 rounded-full");
  return `<div class="mt-1 flex items-center gap-2"><span class="hidden text-[13px] text-muted-foreground sm:inline">${s.on ? "On" : "Off"}</span>${Switch({
    checked: s.on,
    label: `Turn ${d.name} ${s.on ? "off" : "on"}`,
    action: "power",
    data: `data-id="${d.id}"`,
  })}</div>`;
}

function OfflineBanner(d) {
  const busy = S.ui.retrying === d.id;
  return `<div class="${BANNER} bg-muted/50">${icon("wifi-off", "size-4 text-muted-foreground")}
    <div class="min-w-0 flex-1 text-sm"><p class="font-medium">${esc(d.name)} is offline</p>
      <p class="text-[13px] text-muted-foreground">Last seen ${relativeTime(d.lastSeen)} at <span class="font-mono">${esc(d.lastIp)}</span>. Settings are unavailable until it reconnects.</p></div>
    <button type="button" class="${button({ variant: "outline", size: "sm" })}" data-a="retry" data-id="${d.id}"${busy ? " disabled" : ""}>${busy ? spinner() : icon("rotate-cw")}Retry</button>
  </div>`;
}

function PendingRebootBanner(d) {
  const p = q(`${d.id}:pending`, () => getPendingReboot(d.id)).data;
  if (!p || !p.length) return "";
  return `<div class="${BANNER}">${icon("rotate-cw", "size-4 text-muted-foreground")}
    <p class="min-w-0 flex-1 text-sm">The new ${p.join(" and ")} ${p.length > 1 ? "take" : "takes"} effect after a reboot.</p>
    <button type="button" class="${button({ variant: "outline", size: "sm" })}" data-a="askReboot" data-id="${d.id}">Reboot now</button>
  </div>`;
}

function Placeholder(tab) {
  const [ic, label] = tab === "segments" ? ["layers", "Segments"] : tab === "presets" ? ["bookmark", "Presets"] : ["palette", "Light control"];
  return `<div class="${CARD} ${PANEL_CENTER} border-dashed py-16">${icon(ic, "size-6 text-muted-foreground")}<p class="font-medium">${label}</p><p class="max-w-xs text-sm text-muted-foreground">Designed in the next round.</p></div>`;
}

A.unlock = (el) => {
  const name = (S.cache.devices?.data ?? []).find((d) => d.id === el.dataset.id)?.name;
  askPin(el.dataset.id).then(
    () => toast("success", `${name} unlocked for 15 minutes`),
    () => {},
  );
};
A.askReboot = (el) => {
  const d = (S.cache.devices?.data ?? []).find((x) => x.id === el.dataset.id);
  S.modal = { type: "reboot", deviceId: d.id, name: d.name };
  render();
};

// ---------------------------------------------------------------------------
// Settings overview: section list (+ selected section on desktop)
// ---------------------------------------------------------------------------
const SECTIONS = [
  { id: "device", title: "Device", icon: "lightbulb" },
  { id: "led-hardware", title: "LED Hardware", icon: "cable" },
  { id: "network", title: "Network", icon: "wifi" },
  { id: "sync", title: "Sync", icon: "repeat-2" },
  { id: "system", title: "System", icon: "cpu" },
  { id: "advanced", title: "Advanced", icon: "external-link" },
];

function groupsText(mask) {
  const g = [1, 2, 3, 4, 5, 6, 7, 8].filter((n) => mask & (1 << (n - 1)));
  if (!g.length) return "";
  const list = g.length > 2 ? `${g.slice(0, -1).join(", ")} and ${g.at(-1)}` : g.join(" and ");
  return `${g.length > 1 ? "groups" : "group"} ${list}`;
}

function sectionSummary(id, cfg, info) {
  if (id === "advanced") return "Open the WLED settings for everything else";
  if (id === "system") return info ? `WLED ${info.ver} · ${archLabel(info.arch)} · up ${uptimeShort(info.uptime)}` : null;
  if (!cfg) return null;
  if (id === "device") return `${cfg.id.name} · ${cfg.def.on ? `turns on at boot to ${briToPct(cfg.def.bri)}%` : "stays off at boot"}`;
  if (id === "led-hardware") {
    const n = cfg.hw.led.ins.length;
    const total = cfg.hw.led.ins.reduce((t, o) => t + o.len, 0);
    return `${n} ${n === 1 ? "output" : "outputs"} · ${total} LEDs · ${cfg.hw.led.maxpwr ? `${formatAmps(cfg.hw.led.maxpwr)} limit` : "no current limit"}`;
  }
  if (id === "network") return [cfg.nw.ins[0]?.ssid, info?.ip, cfg.id.mdns ? `${cfg.id.mdns}.local` : null].filter(Boolean).join(" · ");
  if (id === "sync") {
    const s = cfg.if.sync;
    return `${s.send.en ? `Sending to ${groupsText(s.send.grp)}` : "Not sending"} · ${s.recv.grp ? `receiving from ${groupsText(s.recv.grp)}` : "not receiving"}`;
  }
  return null;
}

function SettingsView(r, d) {
  const base = `/devices/${d.id}/settings`;
  const known = SECTIONS.find((s) => s.id === r.section);
  if (r.section && !known) {
    return `<div class="${CARD} p-6"><p class="font-medium">There's no settings section called "${esc(r.section)}".</p>
      <a href="#${base}" data-nav="${base}" class="${button({ variant: "link", size: "inline" })}">Back to settings</a></div>`;
  }
  // Phone: the list and each section are separate routes.
  if (!S.desktop) {
    if (!known) return SectionList(d, null);
    return `<a href="#${base}" data-nav="${base}" class="${BACK_LINK} mb-2">${icon("arrow-left")}Settings</a>${SectionView(known.id, d)}`;
  }
  // Desktop: list on the left, selected section (default: Device) on the right.
  const active = known?.id ?? "device";
  return `<div class="grid grid-cols-[280px_minmax(0,1fr)] items-start gap-8">
    <div class="sticky top-[calc(env(safe-area-inset-top,0px)+72px)]">${SectionList(d, active)}</div>
    <div class="min-w-0">${SectionView(active, d)}</div>
  </div>`;
}

function SectionList(d, active) {
  const online = d.online && !S.reboot[d.id];
  const cfg = q(`${d.id}:config`, () => api.getConfig(d.id), { enabled: online }).data;
  const info = q(`${d.id}:info`, () => api.getInfo(d.id), { enabled: online, ttl: 10000 }).data;
  return `<nav aria-label="Settings sections"><ul class="flex flex-col overflow-hidden rounded-lg border bg-card">${SECTIONS.map((s, i) => {
    const disabled = !online && s.id !== "advanced";
    const isActive = active === s.id;
    const text = disabled ? "Unavailable while offline" : sectionSummary(s.id, cfg, info);
    const inner = `<span class="${cn(
      "flex h-9 w-9 shrink-0 items-center justify-center rounded-md border",
      isActive ? "border-primary/50 bg-primary/10 text-primary" : "bg-muted",
    )}">${icon(s.icon)}</span>
      <span class="flex min-w-0 flex-1 flex-col gap-0.5"><span class="text-sm font-medium">${s.title}</span>
        <span class="line-clamp-2 text-[13px] leading-snug text-muted-foreground">${text === null ? skel("mt-1 h-3 w-40 max-w-full") : esc(text)}</span></span>
      ${icon("chevron-right", "size-4 text-muted-foreground")}`;
    const row = cn("flex min-h-[60px] items-center gap-3 px-3 py-2.5 transition-colors", i > 0 && "border-t", isActive ? "bg-accent" : "hover:bg-accent/60");
    const path = `/devices/${d.id}/settings/${s.id}`;
    return `<li>${
      disabled
        ? `<div aria-disabled="true" class="${cn(row, "cursor-not-allowed opacity-50")}">${inner}</div>`
        : `<a href="#${path}" data-nav="${path}"${attr(isActive, "aria-current", "page")} class="${cn(
            row,
            "focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ring",
          )}">${inner}</a>`
    }</li>`;
  }).join("")}</ul></nav>`;
}

function SectionView(id, d) {
  if (id === "system") return SystemSection(d);
  if (id === "advanced") return AdvancedSection(d);
  if (S.reconnect && S.reconnect.deviceId === d.id && id === "network") return ReconnectView(d);
  // Config-backed sections: load GET config, show skeletons, keep a disabled form if the device drops mid-edit.
  const online = d.online && !S.reboot[d.id];
  const key = `${d.id}:${id}`;
  const hasForm = S.form?.key === key;
  const cfg = q(`${d.id}:config`, () => api.getConfig(d.id), { enabled: online });
  if (!hasForm && (!cfg.data || cfg.fetching)) return online && cfg.status !== "error" ? SectionSkeleton() : OfflineSection();
  const ctx = { d, key, offline: !online };
  if (id === "device") return DeviceSection(cfg.data, ctx);
  if (id === "led-hardware") return LedSection(cfg.data, ctx);
  if (id === "network") return NetworkSection(cfg.data, ctx);
  if (id === "sync") return SyncSection(cfg.data, ctx);
  return "";
}

function OfflineSection() {
  return `<div class="${CARD} ${PANEL_CENTER} border-dashed py-12">${icon("wifi-off", "size-5 text-muted-foreground")}<p class="font-medium">Settings are unavailable while the device is offline</p><p class="max-w-sm text-sm text-muted-foreground">They'll load again as soon as it reconnects.</p></div>`;
}
function SectionSkeleton() {
  return `<div class="flex flex-col gap-4" aria-busy="true" aria-label="Loading">${skel("h-6 w-40")}${skel("h-4 w-72 max-w-full")}${[0, 1]
    .map(() => `<div class="${CARD} flex flex-col gap-4 p-5">${skel("h-4 w-32")}${skel("h-10 w-full")}${skel("h-10 w-full")}</div>`)
    .join("")}</div>`;
}

// Opening a settings section marks its config stale so it loads fresh (with skeletons).
const _navigate = navigate;
navigate = function (path, opts) {
  const m = path.match(/^\/devices\/([^/?]+)\/settings/);
  const changing = S.path.split("?")[0] !== path.split("?")[0];
  _navigate(path, opts);
  if (m && changing && S.path === path && S.cache[`${m[1]}:config`]) S.cache[`${m[1]}:config`].stale = true;
};

// ---------------------------------------------------------------------------
// Section: Device
// ---------------------------------------------------------------------------
function DeviceSection(config, { d, key, offline }) {
  const f = useForm(key, () => ({ name: config.id.name, def: { ...config.def } }));
  const v = f.draft;
  const name = v.name.trim();
  const nameError = !name ? "Give the device a name." : name.length > 32 ? `Keep it to 32 characters (${name.length} now).` : "";
  const presets = q(`${d.id}:presets`, () => api.getPresets(d.id), { enabled: !offline });
  const disabled = f.saving || offline;

  return `<div>
    ${SectionHead("Device", "What this controller is called and how it starts up.")}
    <fieldset class="${FIELDSET}"${disabled ? " disabled" : ""}>
      ${SettingsCard({
        body: Field({
          id: "device-name",
          label: "Device name",
          control: `<input id="device-name" class="${INPUT}" value="${esc(v.name)}" maxlength="40" autocomplete="off" data-in="field" data-path="name" aria-describedby="device-name-desc device-name-msg"${attr(
            nameError,
            "aria-invalid",
            "true",
          )}>`,
          help: `Also the name other WLED devices, Home Assistant and other integrations see. <span class="tabular-nums">${name.length}/32</span>`,
          error: nameError,
        }),
      })}
      ${SettingsCard({
        title: "When powered on",
        description: "What the lights do when the controller gets power or restarts.",
        body: `
          ${SwitchRow({ id: "def-on", label: "Turn lights on at boot", control: Switch({ id: "def-on", checked: v.def.on, path: "def.on" }) })}
          <div class="flex flex-col gap-3">
            <div class="flex items-baseline justify-between gap-3"><label for="def-bri" class="text-sm font-medium">Boot brightness</label>
              <span class="text-sm tabular-nums">${briToPct(v.def.bri)}% <span class="text-[13px] text-muted-foreground">· ${v.def.bri} of 255</span></span></div>
            ${Slider({ id: "def-bri", value: v.def.bri, label: "Boot brightness", path: "def.bri", disabled })}
          </div>
          ${Field({
            id: "def-ps",
            label: "Boot preset",
            control: presets.data
              ? Select({
                  id: "def-ps",
                  value: v.def.ps,
                  path: "def.ps",
                  options: [{ v: 0, label: "None" }, ...presets.data.map((p) => ({ v: p.id, label: p.name }))],
                  disabled: disabled || presets.data.length === 0,
                })
              : skel("h-10 w-full"),
            help:
              presets.data && presets.data.length === 0
                ? "This device has no presets yet. Save one from the Presets tab to start with it."
                : "Starts this preset instead of the last color and effect.",
          })}`,
      })}
    </fieldset>
    ${SaveBar({ dirty: formDirty(f), saving: f.saving, errorCount: nameError ? 1 : 0, save: "saveDevice" })}
    <div class="${SEPARATOR} my-8"></div>
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="flex flex-col gap-1"><p class="text-sm font-medium">Remove from this app</p>
        <p class="text-[13px] text-muted-foreground">Strand stops showing this device. Nothing on the device changes.</p></div>
      <button type="button" class="${button({ variant: "destructive-outline" })}" data-a="askRemove" data-id="${d.id}">${icon("trash-2")}Remove device</button>
    </div>
  </div>`;
}

A.discard = () => {
  if (!S.form) return;
  S.form.draft = deepClone(S.form.base);
  S.ui.open = {};
  render();
};
A.saveDevice = async () => {
  const f = S.form;
  const id = f.key.split(":")[0];
  const fresh = await saveSection(id, "Device settings", { id: { name: f.draft.name.trim() }, def: f.draft.def });
  if (fresh && S.form === f) {
    f.base = { name: fresh.id.name, def: { ...fresh.def } };
    f.draft = deepClone(f.base);
    render();
  }
};
A.askRemove = (el) => {
  const d = S.cache.devices.data.find((x) => x.id === el.dataset.id);
  S.modal = { type: "remove", deviceId: d.id, name: d.name };
  render();
};

// ---------------------------------------------------------------------------
// Section: System (read-only, refreshed every 10 s, uptime ticks live)
// ---------------------------------------------------------------------------
function systemRows(info, uptime) {
  return [
    ["WLED version", `${info.ver} (build ${info.vid})`],
    ["Hardware", `${archLabel(info.arch)} · ${info.clock} MHz · ${info.flash} MB flash`],
    ["IP address", info.ip],
    ["MAC address", formatMac(info.mac)],
    ["Uptime", uptimeLong(uptime)],
    ["Wi-Fi signal", formatRssi(info.wifi.rssi)],
    ["Free memory", `${formatKB(info.freeheap)}${info.psram ? ` · PSRAM ${formatMB(info.psram)}` : ""}`],
    ["Storage", `${info.fs.u} / ${info.fs.t} kB`],
    ["LEDs", `${info.leds.count} LEDs · ${info.leds.fps} FPS`],
    ["Current", info.leds.maxpwr ? `${(info.leds.pwr / 1000).toFixed(1)} A of ${formatAmps(info.leds.maxpwr)}` : "Limiter off"],
  ];
}

function SystemSection(d) {
  const rebooting = !!S.reboot[d.id];
  const online = d.online && !rebooting;
  const iq = q(`${d.id}:info`, () => api.getInfo(d.id), { enabled: online, ttl: 10000 });
  const info = iq.data;
  const uptime = info ? info.uptime + Math.max(0, Math.floor((Date.now() - iq.at) / 1000)) : 0;
  const ROW = "flex flex-col gap-1 px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:gap-4";
  let body;
  if (rebooting) {
    body = `<div role="status" aria-live="polite" class="${CARD} ${PANEL_CENTER}">${spinner("size-7 text-primary")}<p class="text-lg font-semibold">Rebooting…</p><p class="text-sm text-muted-foreground">Waiting for ${esc(
      d.name,
    )} to answer again. This takes about 10 seconds.</p></div>`;
  } else if (!online && !info) {
    body = OfflineSection();
  } else {
    const rows = info
      ? systemRows(info, uptime)
          .map(([k, v], i) => {
            let val = esc(v);
            if (k === "IP address")
              val = `<span class="inline-flex items-center gap-1"><span class="font-mono">${esc(v)}</span><button type="button" class="${button({
                variant: "ghost",
                size: "icon-sm",
              })}" aria-label="Copy IP address" data-a="copy" data-text="${esc(v)}" data-what="IP address">${icon("copy")}</button></span>`;
            if (k === "MAC address") val = `<span class="font-mono">${esc(v)}</span>`;
            if (k === "Storage")
              val = `<span class="flex items-center gap-3 sm:justify-end">${ProgressBar((info.fs.u / info.fs.t) * 100, { className: "h-1.5 w-28", label: "Storage used" })}${esc(v)}</span>`;
            return `<div class="${cn(ROW, i > 0 && "border-t")}"><dt class="text-[13px] text-muted-foreground">${k}</dt><dd class="text-sm tabular-nums sm:text-right">${val}</dd></div>`;
          })
          .join("")
      : Array.from({ length: 10 }, (_, i) => `<div class="${cn(ROW, i > 0 && "border-t")}">${skel("h-4 w-28")}${skel("h-4 w-40")}</div>`).join("");
    body = `<div class="flex flex-col gap-4">
      <dl class="${CARD} m-0">${rows}</dl>
      <div class="flex flex-col gap-2 sm:flex-row">
        <button type="button" class="${button({ variant: "outline" })}" data-a="askReboot" data-id="${d.id}"${online ? "" : " disabled"}>${icon("power")}Reboot device</button>
        <button type="button" class="${button({ variant: "outline" })}" data-a="copyDiag" data-id="${d.id}"${info ? "" : " disabled"}>${icon("clipboard-copy")}Copy diagnostics</button>
      </div>
    </div>`;
  }
  return `<div>${SectionHead("System", "What this controller is running, refreshed every 10 seconds.")}${body}</div>`;
}

function copyText(text, what) {
  // Must run inside the click handler; falls back to a selectable text box when blocked.
  navigator.clipboard.writeText(text).then(
    () => toast("success", `${what} copied`),
    () => {
      S.modal = { type: "copy", text };
      render();
    },
  );
}
A.copy = (el) => copyText(el.dataset.text, el.dataset.what);
A.copyDiag = (el) => {
  const id = el.dataset.id;
  const e = S.cache[`${id}:info`];
  const name = S.cache.devices.data.find((x) => x.id === id).name;
  const uptime = e.data.uptime + Math.floor((Date.now() - e.at) / 1000);
  const text = [`${name} (Strand diagnostics, ${new Date().toISOString()})`, ...systemRows(e.data, uptime).map(([k, v]) => `${k}: ${v}`)].join("\n");
  copyText(text, "Diagnostics");
};

function AdvancedSection(d) {

  const url = `http://${info?.ip ?? d.lastIp}/settings`;
  const items = [
    "Time, sunrise and schedules",
    "Buttons and IR remotes",
    "2D matrices",
    "Usermods",
    "MQTT",
    "Home Assistant and other integrations",
    "Firmware updates",
    "Security and the settings PIN",
  ];
  return `<div>${SectionHead("Advanced", "Some WLED settings aren't in Strand yet. You can change them in WLED's own settings pages.")}
    <div class="${CARD} flex flex-col gap-5 p-4 sm:p-5">
      <div class="flex flex-col gap-2"><h3 class="text-sm font-medium">Only in the WLED settings for now</h3>
        <ul class="grid gap-x-6 gap-y-1.5 text-sm text-muted-foreground sm:grid-cols-2">${items.map((x) => `<li class="flex gap-2"><span aria-hidden="true">·</span>${x}</li>`).join("")}</ul></div>
      <div class="flex flex-col gap-3 border-t pt-5">
        <a href="${esc(url)}" target="_blank" rel="noreferrer" class="${button({ className: "self-start" })}">${icon("external-link")}Open WLED Advanced UI</a>
        <p class="text-[13px] text-muted-foreground">Opens <span class="font-mono text-foreground">${esc(url)}</span></p>
        <p class="flex items-start gap-2 text-[13px] text-muted-foreground">${icon("info", "mt-0.5 size-4")}This opens the device directly, so it only works from your home network. Over Tailscale or a remote proxy, WLED may refuse to save changes.</p>
      </div>
    </div></div>`;
}
/* =============================================================================
   SECTION: LED HARDWARE ("/devices/:id/settings/led-hardware")
   Pure logic (pin slots, auto starts, memory, recommended supply, save diff)
   lives in the "LED model" block above; this block is layout and wiring.
   ============================================================================= */

const BOOT_WARNING = "May stop the board from booting if the strip pulls this pin.";

function ledErrors(d, caps) {
  const e = {};
  const typeOf = (i) => caps.ledTypes.find((t) => t.i === i);
  d.outs.forEach((o, i) => {
    const t = typeOf(o.type);
    const slots = pinSlots(t);
    slots.forEach((s, j) => {
      if ((o.pin[j] ?? -1) < 0) e[`o${i}.pin${j}`] = slots.length > 1 ? `Choose a pin for ${s}.` : "Choose a pin.";
    });
    if (isDigital(t)) {
      if (!Number.isInteger(o.len) || o.len < 1) e[`o${i}.len`] = "Enter how many LEDs are on this output.";
      else if (o.len > caps.limits.maxLedsPerOutput) e[`o${i}.len`] = `One output can drive up to ${caps.limits.maxLedsPerOutput.toLocaleString()} LEDs.`;
    }
    if (o.customStart && (!Number.isInteger(o.start) || o.start < 0)) e[`o${i}.start`] = "Enter a whole number, 0 or more.";
    if (!Number.isInteger(o.skip) || o.skip < 0 || o.skip > 255) e[`o${i}.skip`] = "Enter 0 to 255.";
    if (o.ledmaCustom && (!Number.isInteger(o.ledma) || o.ledma < 1 || o.ledma > 254)) e[`o${i}.ledma`] = "Enter 1 to 254 mA.";
  });
  const total = d.outs.reduce((t, o) => t + (Number.isFinite(o.len) ? o.len : 0), 0);
  if (total > caps.limits.maxLeds) e.total = `This chip handles up to ${caps.limits.maxLeds.toLocaleString()} LEDs in total.`;
  if (d.maxpwr !== 0 && (!Number.isFinite(d.maxpwr) || d.maxpwr < 250 || d.maxpwr > 65000)) e.maxpwr = "Enter 0.25 to 65 A.";
  return e;
}

function ledTotals(d, caps) {
  const typeOf = (i) => caps.ledTypes.find((t) => t.i === i);
  const leds = d.outs.reduce((t, o) => t + (Number.isFinite(o.len) ? o.len : 0), 0);
  const mem = d.outs.reduce((t, o) => t + outputMemory(o, typeOf(o.type)), 0);
  const digital = d.outs.filter((o) => isDigital(typeOf(o.type))).length;
  const pwmPins = d.outs.filter((o) => kindOf(typeOf(o.type)) === "pwm").reduce((t, o) => t + o.pin.length, 0);
  return { leds, mem, memPct: (mem / caps.limits.ledMemoryBytes) * 100, digital, pwmPins };
}

const ampsText = (mA) => (Number.isFinite(mA) ? String(Math.round(mA / 10) / 100) : "");
const STAT_LABEL = "text-xs font-medium uppercase tracking-wider text-muted-foreground";

function LedSection(config, { d, key, offline }) {
  const caps = q(`${d.id}:caps`, () => api.getCapabilities(d.id), { enabled: !offline }).data;
  const pinsRes = q(`${d.id}:pins`, () => api.getPins(d.id), { enabled: !offline }).data;
  if (!caps || !pinsRes) return offline ? OfflineSection() : SectionSkeleton();
  const pins = pinsRes.pins;
  const f = useForm(key, () => toDraft(config));
  if (f.ui.lastLimit === undefined) f.ui.lastLimit = config.hw.led.maxpwr;
  if (f.ui.amps === undefined) f.ui.amps = ampsText(f.draft.maxpwr);
  f.ui.caps = caps;
  f.ui.pins = pins;

  const v = f.draft;
  const errors = ledErrors(v, caps);
  const errorCount = Object.values(errors).filter(Boolean).length;
  const totals = ledTotals(v, caps);
  const limiterOn = v.maxpwr !== 0;
  const disabled = f.saving || offline;
  const info = q(`${d.id}:info`, () => api.getInfo(d.id), { enabled: !offline, ttl: 5000 }).data;
  const supply = recommendedSupply(v.outs, caps.ledTypes);
  const savedLimit = config.hw.led.maxpwr;
  const over = totals.memPct > 100;
  // Memory bar: neutral below 60 %, amber 60–90 %, red above 90 %.
  const memBar = totals.memPct > 90 ? "h-full bg-danger transition-all" : totals.memPct >= 60 ? "h-full bg-warning transition-all" : PROGRESS_INDICATOR;
  const memText = totals.memPct > 90 ? "text-danger" : totals.memPct >= 60 ? "text-warning" : "";

  const stats = `<div class="${CARD} mb-4 grid grid-cols-2 sm:grid-cols-4">
    <div class="flex flex-col gap-1 p-4"><span class="${STAT_LABEL}">LEDs</span><span class="${cn(
      "text-lg font-semibold leading-tight tabular-nums",
      errors.total && "text-danger",
    )}">${totals.leds.toLocaleString()}</span><span class="text-xs text-muted-foreground">of ${caps.limits.maxLeds.toLocaleString()} max</span></div>
    <div class="flex flex-col gap-1 border-l p-4"><span class="${STAT_LABEL}">Outputs</span><span class="text-lg font-semibold leading-tight tabular-nums">${v.outs.length}</span><span class="text-xs text-muted-foreground">${totals.digital} of ${caps.limits.maxDigitalOutputs} digital</span></div>
    <div class="flex flex-col gap-1 border-t p-4 sm:border-l sm:border-t-0"><span class="${STAT_LABEL}">Current</span>${
      !limiterOn || !savedLimit
        ? `<span class="text-base font-semibold leading-tight text-muted-foreground">Not measured</span><span class="text-xs text-muted-foreground">Turn on the limiter to estimate</span>`
        : `<span class="text-lg font-semibold leading-tight tabular-nums">${info ? `${(info.leds.pwr / 1000).toFixed(1)} A now` : "…"}</span><span class="text-xs text-muted-foreground">of ${formatAmps(
            savedLimit,
          )} limit</span>`
    }</div>
    <div class="flex flex-col gap-2 border-l border-t p-4 sm:border-t-0">
      <div class="flex items-baseline justify-between gap-2"><span class="${STAT_LABEL}">LED memory</span><span class="${cn("text-sm font-medium tabular-nums", memText)}">${Math.round(totals.memPct)}%</span></div>
      ${ProgressBar(totals.memPct, { indicator: memBar, label: `LED memory ${Math.round(totals.memPct)}% used` })}
      <span class="text-xs tabular-nums text-muted-foreground">${(totals.mem / 1024).toFixed(1)} of ${(caps.limits.ledMemoryBytes / 1024).toFixed(0)} kB</span>
    </div>
  </div>
  ${when(
    over || errors.total,
    `<p role="alert" class="-mt-2 mb-4 flex items-start gap-2 text-[13px] font-medium text-danger">${icon("triangle-alert", "mt-0.5 size-4")}${esc(
      errors.total || "These outputs need more memory than this chip has. Use fewer LEDs or a type with fewer color channels.",
    )}</p>`,
  )}`;

  const outputs = v.outs
    .map((o, i) => {
      const t = caps.ledTypes.find((x) => x.i === o.type);
      const open = S.desktop && !!S.ui.open[`out:${o.key}`];
      const hasError = Object.keys(errors).some((k) => k.startsWith(`o${i}.`));
      const warnPin = o.pin.some((p) => pins.find((x) => x.p === p && x.c & 0x18));
      const sep = `<span aria-hidden="true">·</span>`;
      return `<li class="${cn(CARD, open && "border-foreground/25", hasError && "border-danger/50")}">
        <button type="button" class="flex w-full items-center gap-3 rounded-lg p-4 text-left focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ring" data-a="toggleOutput" data-key="${o.key}" aria-expanded="${open}">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md border bg-muted text-sm font-semibold tabular-nums">${i + 1}</span>
          <span class="flex min-w-0 flex-1 flex-col gap-1">
            <span class="flex flex-wrap items-center gap-2"><span class="font-medium">${esc(t?.n ?? `Type ${o.type}`)}</span>${when(hasError, `<span class="${badge("danger")}">Needs attention</span>`)}</span>
            <span class="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[13px] tabular-nums text-muted-foreground">
              <span class="inline-flex items-center gap-1 font-mono text-xs">${pinLabel(o.pin)}${when(warnPin, icon("triangle-alert", "size-3.5 text-warning"))}</span>
              ${sep}<span>${rangeLabel(o)}</span>
              ${when(isDigital(t), `${sep}<span>${COLOR_ORDERS[o.order & 15]}</span>`)}
              ${when(o.rev, `${sep}<span class="inline-flex items-center gap-1">${icon("arrow-left-right", "size-3")}Reversed</span>`)}
            </span>
          </span>
          ${icon(S.desktop ? "chevron-down" : "chevron-right", cn("size-4 text-muted-foreground transition-transform", open && "rotate-180"))}
        </button>
        ${when(open, () => `<div class="flex flex-col gap-5 border-t p-4 sm:p-5">${OutputEditor(i, f, errors, totals, disabled)}</div>`)}
      </li>`;
    })
    .join("");

  return `<div>
    ${SectionHead("LED Hardware", "The strips and lights wired to this controller, and how much current they may draw.")}
    ${stats}
    <fieldset class="${FIELDSET}"${disabled ? " disabled" : ""}>
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between gap-3"><h3 class="text-sm font-semibold">Outputs</h3>
          <button type="button" class="${button({ variant: "outline", size: "sm" })}" data-a="addOutput"${totals.leds >= caps.limits.maxLeds ? " disabled" : ""}>${icon("plus")}Add output</button></div>
        <ul class="flex flex-col gap-2">${outputs}</ul>
      </div>
      ${SettingsCard({
        title: "Power limiter",
        description: "Dims the whole device automatically so it never draws more than your power supply can give.",
        body: `
          ${SwitchRow({ id: "limiter", label: "Limit current", control: Switch({ id: "limiter", checked: limiterOn, action: "toggleLimiter" }) })}
          ${when(
            limiterOn,
            () => `
            <div class="${FORM_ITEM}">
              <label for="maxpwr" class="${LABEL}">Power supply</label>
              <div class="relative max-w-[12rem]"><input id="maxpwr" class="${INPUT} pr-10 tabular-nums" inputmode="decimal" value="${esc(f.ui.amps)}" data-in="ampsInput" aria-describedby="maxpwr-msg"${attr(
                errors.maxpwr,
                "aria-invalid",
                "true",
              )}><span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-sm text-muted-foreground">A</span></div>
              ${when(errors.maxpwr, `<p id="maxpwr-msg" role="alert" class="${FORM_MESSAGE}">${errors.maxpwr}</p>`)}
              ${when(
                Number.isFinite(v.maxpwr) && v.maxpwr > 7200 && !errors.maxpwr,
                `<p class="${WARN_MSG}">${icon("triangle-alert", "mt-0.5 size-4")}Make sure your wiring and power supply can handle this.</p>`,
              )}
            </div>
            <div class="${SUBTLE_BOX} flex flex-col gap-3 sm:flex-row sm:items-center">
              <div class="min-w-0 flex-1 text-sm"><p>Recommended supply: <span class="font-medium tabular-nums">${supply.typicalA} A</span></p>
                <p class="text-[13px] text-muted-foreground">Enough for typical effects. Full white on every LED needs about <span class="tabular-nums">${supply.fullWhiteA} A</span>.</p></div>
              <button type="button" class="${button({ variant: "secondary", size: "sm" })}" data-a="useRecommended" data-ma="${Math.round(supply.typicalA * 1000)}"${
                v.maxpwr === Math.round(supply.typicalA * 1000) ? " disabled" : ""
              }>Use ${supply.typicalA} A</button>
            </div>`,
          )}

/** The fields for one output. Rendered inline on desktop, in a bottom <Sheet> on phones. */
function OutputEditor(i, f, errors, totals, disabled) {
  const { caps, pins } = f.ui;
  const all = f.draft.outs;
  const o = all[i];
  const t = caps.ledTypes.find((x) => x.i === o.type);
  const kind = kindOf(t);
  const digital = kind === "digital" || kind === "digital2";
  const slots = pinSlots(t);
  const id = (x) => `out${i}-${x}`;
  const err = (x) => errors[`o${i}.${x}`] ?? "";
  const prev = all[i - 1];
  const prevEnd = i === 0 ? 0 : prev.start + (Number.isFinite(prev.len) ? prev.len : 0);
  const data = `data-i="${i}"`;

  // Which LED types this output may switch to, and why the others are disabled.
  const digitalElsewhere = totals.digital - (digital ? 1 : 0);
  const pwmElsewhere = totals.pwmPins - (kind === "pwm" ? o.pin.length : 0);
  const why = (lt) => {
    if (lt.i === o.type) return "";
    const k = kindOf(lt);
    if (k === "network" || k === "other") return " (set up in WLED Advanced UI)";
    if ((k === "digital" || k === "digital2") && digitalElsewhere >= caps.limits.maxDigitalOutputs) return ` (chip has ${caps.limits.maxDigitalOutputs} digital outputs)`;
    if (k === "pwm" && pwmElsewhere + lt.t.length > caps.limits.maxPwmPins) return " (not enough PWM channels left)";
    return "";
  };
  const groups = [
    ["Digital (1 wire)", "digital"],
    ["Digital (2 wire)", "digital2"],
    ["PWM", "pwm"],
    ["On/Off relay", "relay"],
    ["Network", "network"],
  ]
    .map(([label, k]) => ({
      group: label,
      options: caps.ledTypes.filter((lt) => kindOf(lt) === k).map((lt) => ({ v: lt.i, label: lt.n + why(lt), disabled: !!why(lt) })),
    }))
    .filter((g) => g.options.length);

  const pinPickers = slots
    .map((slot, j) => {
      const opts = pinOptions(pins, caps, all, i, j, slots);
      const chosen = opts.find((x) => x.p === o.pin[j]);
      const warn = chosen?.warn
        ? `<span tabindex="0" title="${BOOT_WARNING}" class="inline-flex cursor-help items-center gap-1 rounded text-xs text-warning focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">${icon(
            "triangle-alert",
            "size-3.5",
          )}${chosen.warn === "boot" ? "Boot pin" : "Strapping pin"}</span>`
        : "";
      return Field({
        id: id(`pin${j}`),
        label: slots.length === 1 ? (kind === "relay" ? "Relay pin" : "Data pin") : slot,
        trailing: warn,
        control: Select({
          id: id(`pin${j}`),
          value: o.pin[j] ?? -1,
          change: "outPin",
          mono: true,
          placeholder: "Choose a pin",
          invalid: !!err(`pin${j}`),
          data: `${data} data-j="${j}"`,
          options: opts.map((x) => ({
            v: x.p,
            label: `GPIO ${x.p}${x.note ? ` · ${x.note}` : x.warn ? ` · ${x.warn} pin ⚠` : ""}`,
            disabled: x.disabled,
          })),
        }),
        error: err(`pin${j}`),
      });
    })
    .join("");

  const num = (fld, value) =>
    `<input id="${id(fld)}" class="${INPUT} max-w-[10rem] tabular-nums" inputmode="numeric" value="${Number.isFinite(value) ? value : ""}" data-in="outField" data-f="${fld}" data-type="int" ${data} aria-describedby="${id(
      fld,
    )}-msg"${attr(err(fld), "aria-invalid", "true")}>`;

  return `
    ${Field({ id: id("type"), label: "LED type", control: Select({ id: id("type"), value: o.type, change: "outType", options: groups, data }) })}
    <div class="${cn("grid gap-4", slots.length > 1 && "sm:grid-cols-2")}">${pinPickers}</div>
    ${when(digital, () =>
      Field({
        id: id("len"),
        label: "LED count",
        control: num("len", o.len),
        help: `<span class="tabular-nums">${totals.leds.toLocaleString()} of ${caps.limits.maxLeds.toLocaleString()} LEDs on this device</span>`,
        error: err("len"),
      }),
    )}
    <div class="flex flex-col gap-3">
      ${SwitchRow({
        id: id("cstart"),
        label: "Custom start",
        description: o.customStart ? "Set where this output begins in the LED index." : `Starts at LED ${prevEnd}${i > 0 ? `, right after Output ${i}` : ""}.`,
        control: Switch({ id: id("cstart"), checked: o.customStart, action: "outCustomStart", data, disabled }),
      })}
      ${when(o.customStart, () => Field({ id: id("start"), label: "Start LED", srLabel: true, control: num("start", o.start), error: err("start") }))}
    </div>
    ${when(digital, () =>
      Field({
        id: id("order"),
        label: "Color order",
        control: Select({ id: id("order"), value: o.order & 15, change: "outOrder", className: "max-w-[12rem]", data, options: COLOR_ORDERS.map((c, k) => ({ v: k, label: c })) }),
        help: "Not sure? Set to RGB and light it red; if it shows green, pick GRB.",
      }),
    )}
    ${SwitchRow({
      id: id("rev"),
      label: "Reversed",
      description: "Run effects from the far end of the strip.",
      control: Switch({ id: id("rev"), checked: o.rev, action: "outRev", data, disabled }),
    })}
    ${when(digital && f.draft.maxpwr !== 0, () =>
      Field({
        id: id("ledma"),
        label: "Power per LED",
        control:
          Select({
            id: id("ledma"),
            value: o.ledmaCustom ? "custom" : o.ledma,
            change: "outLedma",
            type: "str",
            data,
            options: [...LEDMA_PRESETS.map((p) => ({ v: p.v, label: p.label })), { v: "custom", label: "Custom" }],
          }) +
          when(
            o.ledmaCustom,
            () =>
              `<div class="relative max-w-[10rem]"><input class="${INPUT} pr-12 tabular-nums" aria-label="Custom milliamps per LED" inputmode="numeric" value="${
                Number.isFinite(o.ledma) ? o.ledma : ""
              }" data-in="outField" data-f="ledma" data-type="int" ${data}${attr(err("ledma"), "aria-invalid", "true")}><span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-sm text-muted-foreground">mA</span></div>`,
          ),
        help: "Used to estimate current. Check your strip's datasheet for full-white draw.",
        error: err("ledma"),
      }),
    )}
    ${Disclosure(`skip:${o.key}`, "Advanced", () =>
      Field({
        id: id("skip"),
        label: "Skip first LEDs",
        control: num("skip", o.skip),
        help: "Leaves the first LEDs dark, for example ones hidden inside an enclosure.",
        error: err("skip"),
      }),
    )}
    <div class="flex justify-end border-t pt-4">${
      all.length > 1
        ? `<button type="button" class="${button({ variant: "destructive-ghost", size: "sm" })}" data-a="removeOutput" ${data}>${icon("trash-2")}Remove output</button>`
        : `<p class="text-[13px] text-muted-foreground">A device needs at least one output.</p>`
    }</div>`;
}

// --- LED actions -------------------------------------------------------------
function setOuts(fn) {
  updateDraft((d) => ({ ...d, outs: autoStarts(fn(d.outs)) }));
}
function setOut(i, patch) {
  setOuts((outs) => outs.map((o, k) => (k === i ? { ...o, ...patch } : o)));
}
A.toggleOutput = (el) => {
  const k = `out:${el.dataset.key}`;
  if (S.desktop) S.ui.open[k] = !S.ui.open[k];
  else S.modal = { type: "output", key: el.dataset.key };
  render();
};
A.outField = (el) => setOut(Number(el.dataset.i), { [el.dataset.f]: readValue(el) });
A.outRev = (el) => setOut(Number(el.dataset.i), { rev: el.getAttribute("aria-checked") !== "true" });
A.outCustomStart = (el) => setOut(Number(el.dataset.i), { customStart: el.getAttribute("aria-checked") !== "true" });
A.outOrder = (el) => {
  const i = Number(el.dataset.i);
  setOut(i, { order: (S.form.draft.outs[i].order & 0xf0) | Number(el.value) });
};
A.outPin = (el) => {
  const i = Number(el.dataset.i);
  const pin = [...S.form.draft.outs[i].pin];
  pin[Number(el.dataset.j)] = Number(el.value);
  setOut(i, { pin });
};
A.outLedma = (el) => {
  const i = Number(el.dataset.i);
  const o = S.form.draft.outs[i];
  if (el.value === "custom") setOut(i, { ledmaCustom: true, ledma: o.ledma === 255 ? 12 : o.ledma });
  else setOut(i, { ledmaCustom: false, ledma: Number(el.value) });
};
A.outType = (el) => {
  const i = Number(el.dataset.i);
  const { caps, pins } = S.form.ui;
  const all = S.form.draft.outs;
  const o = all[i];
  const nt = caps.ledTypes.find((x) => x.i === Number(el.value));
  const next = pinSlots(nt).map((_, j) => o.pin[j] ?? -1);
  // Fill new pickers with free pins so the form starts out valid.
  next.forEach((p, j) => {
    if (p < 0) next[j] = firstFreePin(pins, caps, all.filter((_, k) => k !== i), next.filter((x) => x >= 0));
  });
  setOut(i, { type: nt.i, pin: next, len: isDigital(nt) ? (o.len > 1 ? o.len : 30) : 1 });
};
A.addOutput = () => {
  const { caps, pins } = S.form.ui;
  const digitalOk = ledTotals(S.form.draft, caps).digital < caps.limits.maxDigitalOutputs;
  const key = `n${Date.now()}`;
  setOuts((outs) => [
    ...outs,
    { type: digitalOk ? 22 : 41, pin: [firstFreePin(pins, caps, outs)], start: 0, len: digitalOk ? 30 : 1, order: 0, rev: false, skip: 0, ledma: 55, key, customStart: false, ledmaCustom: false },
  ]);
  if (S.desktop) S.ui.open[`out:${key}`] = true;
  else S.modal = { type: "output", key };
  render();
};
A.removeOutput = (el) => {
  const i = Number(el.dataset.i);
  setOuts((outs) => outs.filter((_, k) => k !== i));
  if (S.modal?.type === "output") S.modal = null;
};
A.toggleLimiter = () => {
  const f = S.form;
  if (f.draft.maxpwr !== 0) {
    f.ui.lastLimit = f.draft.maxpwr;
    updateDraft((d) => ({ ...d, maxpwr: 0 }));
  } else {
    const ma = f.ui.lastLimit || Math.round(recommendedSupply(f.draft.outs, f.ui.caps.ledTypes).typicalA * 1000) || 5000;
    f.ui.amps = ampsText(ma);
    updateDraft((d) => ({ ...d, maxpwr: ma }));
  }
};
A.ampsInput = (el) => {
  S.form.ui.amps = el.value;
  const a = parseFloat(el.value.replace(",", "."));
  const ok = /^\s*\d*([.,]\d*)?\s*$/.test(el.value) && Number.isFinite(a);
  updateDraft((d) => ({ ...d, maxpwr: ok ? Math.round(a * 1000) : NaN }));
};
A.useRecommended = (el) => {
  const ma = Number(el.dataset.ma);
  S.form.ui.amps = ampsText(ma);
  updateDraft((d) => ({ ...d, maxpwr: ma }));
};
A.discardLed = () => {
  S.form.draft = deepClone(S.form.base);
  S.form.ui.amps = ampsText(S.form.base.maxpwr);
  S.ui.open = {};
  render();
};
A.saveLed = () => {
  const f = S.form;
  if (outputsChanged(f.base, f.draft)) {
    S.modal = { type: "confirmLed", lines: diffLines(f.base, f.draft, f.ui.caps.ledTypes) };
    render();
  } else doSaveLed();
};
async function doSaveLed() {
  S.modal = null;
  const f = S.form;
  const id = f.key.split(":")[0];
  const fresh = await saveSection(id, "LED hardware", { hw: { led: fromDraft(f.draft) }, light: { "scale-bri": f.draft.scaleBri } });
  if (fresh && S.form === f) {
    f.base = toDraft(fresh);
    f.draft = deepClone(f.base);
    f.ui.amps = ampsText(f.base.maxpwr);
    S.ui.open = {};
    render();
  }
}
/* =============================================================================
   SECTION: NETWORK ("/devices/:id/settings/network")
   Disruptive fields carry a "Reconnects" or "After reboot" badge. Saving a
   reconnect-type change goes through the confirm → progress → result flow.
   ============================================================================= */

const AP_BEHAVIORS = [
  { v: 0, label: "When not connected after boot" },
  { v: 1, label: "When disconnected" },
  { v: 2, label: "Always" },
  { v: 4, label: "Temporary, closes after 5 min" },
];
S.ui.showPw = {};

function netToDraft(c) {
  return {
    nets: c.nw.ins.map((e, i) => {
      const dhcp = isZeroIp(e.ip);
      return {
        key: `w${i}`, ssid: e.ssid, pskl: e.pskl, psk: null, secured: null,
        mode: dhcp ? "dhcp" : "static",
        ip: dhcp ? "" : ipToString(e.ip), gw: dhcp ? "" : ipToString(e.gw), sn: dhcp ? "255.255.255.0" : ipToString(e.sn),
      };
    }),
    mdns: c.id.mdns,
    ap: { ssid: c.ap.ssid, pskl: c.ap.pskl, psk: null, chan: c.ap.chan, behav: c.ap.behav, hide: c.ap.hide },
  };
}
function netEntry(n) {
  const st = n.mode === "static";
  return {
    ssid: n.ssid.trim(),
    pskl: n.pskl,
    ...(n.psk !== null ? { psk: n.psk } : {}),
    ip: st ? parseIp(n.ip) ?? ZERO_IP : ZERO_IP,
    gw: st ? parseIp(n.gw) ?? ZERO_IP : ZERO_IP,
    sn: st ? parseIp(n.sn) ?? [255, 255, 255, 0] : [255, 255, 255, 0],
  };
}
/** Exactly what the device receives; also what "has anything changed?" compares. */
function netPatch(d) {
  return {
    id: { mdns: d.mdns.trim() },
    nw: { ins: d.nets.map(netEntry) },
    ap: { ssid: d.ap.ssid.trim(), pskl: d.ap.pskl, ...(d.ap.psk !== null ? { psk: d.ap.psk } : {}), chan: d.ap.chan, behav: d.ap.behav, hide: d.ap.hide },
  };
}
function netClassify(base, d) {
  const reconnect =
    base.nets.map((n) => n.ssid.trim()).join("|") !== d.nets.map((n) => n.ssid.trim()).join("|") ||
    d.nets.some((n) => n.psk !== null) ||
    base.ap.ssid !== d.ap.ssid.trim() ||
    d.ap.psk !== null ||
    base.ap.chan !== d.ap.chan;
  const ipKey = (x) => x.nets.map((n) => JSON.stringify([netEntry(n).ip, netEntry(n).gw, netEntry(n).sn])).join("|");
  const reboot = ipKey(base) !== ipKey(d) || base.mdns !== d.mdns.trim();
  return { reconnect, reboot };
}
function netErrors(d) {
  const e = {};
  const seen = new Set();
  d.nets.forEach((n, i) => {
    const ssid = n.ssid.trim();
    if (!ssid) e[`n${i}.ssid`] = "Enter the network name.";
    else if (ssid.length > 32) e[`n${i}.ssid`] = "Network names are at most 32 characters.";
    else if (seen.has(ssid)) e[`n${i}.ssid`] = "This network is already in the list.";
    seen.add(ssid);
    if (n.psk !== null) {
      if (n.psk.length > 0 && (n.psk.length < 8 || n.psk.length > 63)) e[`n${i}.psk`] = "Wi-Fi passwords are 8 to 63 characters.";
      else if (n.psk.length === 0 && n.secured) e[`n${i}.psk`] = `Enter the password for ${ssid || "this network"}.`;
    }
    if (n.mode === "static") {
      const ip = parseIp(n.ip), gw = parseIp(n.gw), sn = parseIp(n.sn);
      if (!ip || isZeroIp(ip)) e[`n${i}.ip`] = "Enter an address like 192.168.1.50.";
      if (!gw) e[`n${i}.gw`] = "Enter the router's address, like 192.168.1.1.";
      if (!sn || !isValidSubnet(sn)) e[`n${i}.sn`] = "Enter a subnet mask like 255.255.255.0.";
      if (ip && gw && sn && isValidSubnet(sn) && !ip.every((o, k) => (o & sn[k]) === (gw[k] & sn[k])))
        e[`n${i}.gw`] = "The gateway must be on the same subnet as the address.";
    }
  });
  const mdns = d.mdns.trim();
  if (mdns && !/^[A-Za-z0-9-]+$/.test(mdns)) e.mdns = "Use letters, digits and hyphens only.";
  else if (mdns.length > 32) e.mdns = "Keep it to 32 characters.";
  else if (mdns.startsWith("-") || mdns.endsWith("-")) e.mdns = "It can't start or end with a hyphen.";
  if (!d.ap.ssid.trim()) e["ap.ssid"] = "The access point needs a name.";
  else if (d.ap.ssid.trim().length > 32) e["ap.ssid"] = "Keep it to 32 characters.";
  if (d.ap.psk !== null && d.ap.psk.length > 0 && (d.ap.psk.length < 8 || d.ap.psk.length > 63))
    e["ap.psk"] = "Use 8 to 63 characters, or leave it empty for an open access point.";
  return e;
}

function ReconnectView(d) {
  const rc = S.reconnect;

  }
  if (rc.phase === "back") {
    const changed = rc.ip !== rc.oldIp;

          changed
            ? `Its IP address changed from ${esc(rc.oldIp)}. Strand found it again by its MAC address, so nothing else needs updating.`
            : `${esc(d.name)} is connected with the new settings.`
        }</p></div>
      <button type="button" class="${button()}" data-a="reconnectDone">Done</button>

  }
  return `<div class="${CARD} flex flex-col gap-5 p-6">
    <div class="flex items-start gap-3">${icon("wifi-off", "mt-0.5 size-6 text-danger")}
