        <p class="text-sm text-muted-foreground">It's still listed in Strand as offline. It may not have been able to join ${esc(rc.target)}.</p></div></div>
    <ol class="flex list-decimal flex-col gap-2 pl-5 text-sm marker:text-muted-foreground">
      <li>Wait a minute. Some routers are slow to hand out an address.</li>
      <li>Check the network name and password you entered.</li>
      <li>Join the device's access point <span class="font-medium">"${esc(rc.apName)}"</span> from your phone or laptop, then open <span class="font-mono">http://4.3.2.1</span> to fix its Wi-Fi settings.</li>
    </ol>
    <div class="flex flex-wrap gap-2"><button type="button" class="${button()}" data-a="keepWaiting">Keep waiting</button>
      <button type="button" class="${button({ variant: "outline" })}" data-a="reconnectDone">Back to settings</button></div>
  </div>`;
}
// --- Network actions -----------------------------------------------------------
function setNet(i, patch) {
  updateDraft((d) => ({ ...d, nets: d.nets.map((n, k) => (k === i ? { ...n, ...patch } : n)) }));
}
function setPsk(target, psk) {
  if (target === "ap") updateDraft((d) => ({ ...d, ap: { ...d.ap, psk } }));
  else setNet(Number(target), { psk });
}
A.netField = (el) => {
  const f = el.dataset.f;
  setNet(Number(el.dataset.i), f === "ssid" ? { ssid: el.value, secured: null } : { [f]: el.value });
};
A.pwChange = (el) => {
  setPsk(el.dataset.target, "");
  S.focus = el.dataset.target === "ap" ? "ap-psk" : `net${el.dataset.target}-psk`;
};
A.pwKeep = (el) => setPsk(el.dataset.target, null);
A.pwInput = (el) => setPsk(el.dataset.target, el.value);
A.pwReveal = (el) => {
  S.ui.showPw[el.dataset.id] = !S.ui.showPw[el.dataset.id];
  render();
};
A.netMode = (el) => {
  const i = Number(el.dataset.i);
  const n = S.form.draft.nets[i];
  if (el.dataset.v === "static" && !n.ip) {
    const guess = parseIp(S.form.ui.currentIp ?? "");
    setNet(i, { mode: "static", ip: guess ? ipToString(guess) : "", gw: guess ? `${guess[0]}.${guess[1]}.${guess[2]}.1` : "", sn: "255.255.255.0" });
  } else setNet(i, { mode: el.dataset.v });
};
A.netAdd = () =>
  updateDraft((d) => ({
    ...d,
    nets: [...d.nets, { key: `n${Date.now()}`, ssid: "", pskl: 0, psk: "", secured: null, mode: "dhcp", ip: "", gw: "", sn: "255.255.255.0" }],
  }));
A.netRemove = (el) => updateDraft((d) => ({ ...d, nets: d.nets.filter((_, k) => k !== Number(el.dataset.i)) }));
A.apNever = (el) => updateDraft((d) => ({ ...d, ap: { ...d.ap, behav: el.getAttribute("aria-checked") === "true" ? 0 : 3 } }));

A.openScan = async (el) => {
  const i = Number(el.dataset.i);
  const deviceId = S.form.key.split(":")[0];
  S.modal = { type: "scan", i, deviceId, nets: null, error: null };
  render();
  runScan();
};
async function runScan() {
  const m = S.modal;
  m.nets = null;
  m.error = null;
  render();
  try {
    const r = await api.scanNetworks(m.deviceId);
    if (S.modal === m) m.nets = [...r.networks].sort((a, b) => b.rssi - a.rssi);
  } catch (e) {
    if (S.modal === m) m.error = e.message;
  }
  render();
}
A.rescan = () => runScan();
A.pickNet = (el) => {
  const m = S.modal;
  const n = m.nets.find((x) => x.ssid === el.dataset.ssid);
  const cur = S.form.draft.nets[m.i];
  const changed = cur.ssid !== n.ssid;
  S.modal = null;
  setNet(m.i, { ssid: n.ssid, secured: n.enc > 0, psk: n.enc === 0 ? "" : changed ? "" : cur.psk });
  if (n.enc > 0 && changed) S.focus = `net${m.i}-psk`;
};

A.saveNetwork = () => {
  const f = S.form;
  const k = netClassify(f.base, f.draft);
  if (k.reconnect) S.modal = { type: "confirmReconnect", alsoReboot: k.reboot, apName: f.base.ap.ssid };
  else if (k.reboot) S.modal = { type: "confirmRebootSave" };
  else return doSaveNetwork(false);
  render();
};
async function doSaveNetwork(thenReboot) {
  S.modal = null;
  const f = S.form;
  const id = f.key.split(":")[0];
  const fresh = await saveSection(id, "Network settings", netPatch(f.draft), { quiet: thenReboot });
  if (!fresh) return;
  if (S.form === f) {
    f.base = netToDraft(fresh);
    f.draft = deepClone(f.base);
  }
  if (thenReboot) rebootDevice(id, fresh.id.name);
  render();
}
async function doReconnect() {
  S.modal = null;
  const f = S.form;
  const id = f.key.split(":")[0];
  const base = f.base;
  const target = (f.draft.nets.find((n) => !base.nets.some((b) => b.ssid === n.ssid.trim())) ?? f.draft.nets[0]).ssid.trim();
  const oldIp = S.cache[`${id}:info`]?.data?.ip ?? "";
  const fresh = await saveSection(id, "Network settings", netPatch(f.draft), { quiet: true });
  if (!fresh) return;
  f.base = netToDraft(fresh);
  f.draft = deepClone(f.base);
  S.reconnect = { deviceId: id, phase: "reconnecting", started: Date.now(), target, oldIp, apName: fresh.ap.ssid, seenDown: false };
  pollReconnect(S.reconnect);
  render();
}

/** Poll every 2 s until the device answers again; give up after 45 s. */
function pollReconnect(rc) {
  const tick = async () => {
    if (S.reconnect !== rc || rc.phase !== "reconnecting") return;
    const since = Date.now() - rc.started;
    if (since > 45000) {
      rc.phase = "lost";
      return render();
    }
    try {
      const info = await api.getInfo(rc.deviceId);
      if (rc.seenDown || since > 6000) {
        rc.phase = "back";
        rc.ip = info.ip;
        setCache(`${rc.deviceId}:info`, info);
        invalidate((k) => (k.startsWith(rc.deviceId) && !k.endsWith(":info")) || k === "devices");
        return render();
      }
    } catch {
      rc.seenDown = true;
    }
    setTimeout(tick, 2000);
  };
  setTimeout(tick, 2000);
}

A.reconnectDone = () => {
  S.reconnect = null;
  render();
};
A.keepWaiting = () => {
  const rc = S.reconnect;
  rc.phase = "reconnecting";
  rc.started = Date.now();
  pollReconnect(rc);
  render();
};
/* =============================================================================
   SECTION: SYNC ("/devices/:id/settings/sync")
   Group masks are shown as 8 toggle chips; nobody sees a bitmask.
   ============================================================================= */

const GROUPS = [1, 2, 3, 4, 5, 6, 7, 8];
const syncToDraft = (c) => ({
  send: { ...c.if.sync.send },
  recv: { ...c.if.sync.recv, grp: c.if.sync.recv.grp || 1 }, // remembers groups while receiving is off
  recvOn: c.if.sync.recv.grp > 0,
});
const syncPatch = (d) => ({ if: { sync: { send: d.send, recv: { ...d.recv, grp: d.recvOn ? d.recv.grp : 0 } } } });

function SyncSection(config, { d, key, offline }) {
  const f = useForm(key, () => syncToDraft(config), syncPatch);
  const v = f.draft;
  const errors = {
    sendGrp: v.send.en && v.send.grp === 0 ? "Pick at least one group to send to." : "",
    recvGrp: v.recvOn && v.recv.grp === 0 ? "Pick at least one group, or turn receiving off." : "",
  };
  const errorCount = Object.values(errors).filter(Boolean).length;
  const disabled = f.saving || offline;

  // <ToggleGroup type="multiple" variant="outline"> of sync groups 1–8
  const chips = (which, mask, label, error) => `<div class="flex flex-col gap-2.5">
    <span id="${which}-grp-label" class="text-sm font-medium">${label}</span>
    <div role="group" aria-labelledby="${which}-grp-label" class="grid grid-cols-8 gap-1.5 sm:flex sm:flex-wrap">${GROUPS.map(
      (g) =>
        `<button type="button" class="${TOGGLE_OUTLINE} h-11 min-w-0 px-0 tabular-nums sm:w-11" aria-pressed="${!!(mask & (1 << (g - 1)))}" aria-label="Group ${g}" data-a="toggleGroup" data-which="${which}" data-g="${g}">${g}</button>`,
    ).join("")}</div>
    ${when(error, `<p role="alert" class="${FORM_MESSAGE}">${error}</p>`)}
  </div>`;

  const applies = [
    ["bri", "Brightness"],
    ["col", "Colors"],
    ["fx", "Effects"],
    ["pal", "Palette"],
  ];

  return `<div>
    ${SectionHead("Sync", "WLED devices on the same network can mirror each other's changes using sync groups. Changes here apply right away, with no reboot.")}
    <fieldset class="${FIELDSET}"${disabled ? " disabled" : ""}>
      ${SettingsCard({
        title: "Send",
        body: `
          ${SwitchRow({
            id: "send-en",
            label: "Send changes to other devices",
            description: "This is the setting at boot. The quick sync toggle on the control screen only changes it until the next reboot.",
            control: Switch({ id: "send-en", checked: v.send.en, path: "send.en" }),
          })}
          ${when(
            v.send.en,
            () => `
            ${SwitchRow({ id: "send-dir", label: "When changed from the app or API", control: Switch({ id: "send-dir", checked: v.send.dir, path: "send.dir" }) })}
            ${SwitchRow({ id: "send-btn", label: "When a button or IR remote is used", control: Switch({ id: "send-btn", checked: v.send.btn, path: "send.btn" }) })}
            ${chips("send", v.send.grp, "Send to groups", errors.sendGrp)}`,
          )}`,
      })}
      ${SettingsCard({
        title: "Receive",
        body: `
          ${SwitchRow({ id: "recv-on", label: "Receive changes from other devices", control: Switch({ id: "recv-on", checked: v.recvOn, path: "recvOn" }) })}
          ${when(
            v.recvOn,
            () => `
            ${chips("recv", v.recv.grp, "Listen to groups", errors.recvGrp)}
            <fieldset class="m-0 flex flex-col gap-3 border-0 p-0"><legend class="mb-3 text-sm font-medium">Apply</legend>
              <div class="grid grid-cols-2 gap-4 sm:grid-cols-4">${applies
                .map(
                  ([k, label]) => `<label for="recv-${k}" class="flex min-h-6 cursor-pointer items-center gap-2.5 text-sm">
                    <button type="button" role="checkbox" id="recv-${k}" class="${CHECKBOX}" aria-checked="${v.recv[k]}" data-a="toggleField" data-path="recv.${k}">${when(
                      v.recv[k],
                      icon("check", "size-3.5 [stroke-width:3]"),
                    )}</button>${label}</label>`,
                )
                .join("")}</div>
            </fieldset>
            ${Disclosure(
              "sync-adv",
              "Advanced",
              () => `
              ${SwitchRow({
                id: "recv-seg",
                label: "Apply segment options",
                description: "Mirror per-segment settings like effect speed and mirroring.",
                control: Switch({ id: "recv-seg", checked: v.recv.seg, path: "recv.seg" }),
              })}
              ${SwitchRow({
                id: "recv-sb",
                label: "Apply segment bounds",
                description: "Copy where each segment starts and stops. Only useful when the strips match.",
                control: Switch({ id: "recv-sb", checked: v.recv.sb, path: "recv.sb" }),
              })}`,
            )}`,
          )}`,
      })}
      ${SyncPreview(d, v)}
    </fieldset>
    ${SaveBar({ dirty: formDirty(f), saving: f.saving, errorCount, save: "saveSync" })}
  </div>`;
}

/** Who mirrors whom, from every device's sync groups (this one from the unsaved draft). */
function SyncPreview(d, v) {
  const others = (S.cache.devices?.data ?? []).filter((x) => x.id !== d.id);
  const mySend = v.send.en ? v.send.grp : 0;
  const myRecv = v.recvOn ? v.recv.grp : 0;
  const row = (ic, name, text) =>
    `<li class="flex items-center gap-3 py-2.5">${ic}<span class="min-w-0 flex-1 text-sm"><span class="font-medium">${esc(name)}</span><span class="text-muted-foreground"> · ${text}</span></span></li>`;
  const rows = others
    .map((o) => {
      if (!o.online) return row(icon("wifi-off", "size-4 text-muted-foreground"), o.name, "offline, can't check");
      const c = q(`${o.id}:config`, () => api.getConfig(o.id), { ttl: 30000 }).data;
      if (!c) return row(skel("h-4 w-4"), o.name, "checking…");
      const s = c.if.sync;
      const out = mySend & s.recv.grp;
      const inn = (s.send.en ? s.send.grp : 0) & myRecv;
      if (!out && !inn) return "";
      if (out && inn) return row(icon("arrow-left-right", "size-4 text-primary"), o.name, `mirror each other (${groupsText(out | inn)})`);
      if (out) return row(icon("arrow-right", "size-4 text-primary"), o.name, `follows ${esc(d.name)} (${groupsText(out)})`);
      return row(icon("arrow-left", "size-4 text-primary"), o.name, `${esc(d.name)} follows it (${groupsText(inn)})`);
    })
    .filter(Boolean);
  return SettingsCard({
    title: "Devices in sync",
    description: "Other devices in Strand that share a group with this one, including unsaved changes.",
    body: rows.length
      ? `<ul class="-my-1 flex flex-col divide-y">${rows.join("")}</ul>`
      : `<p class="text-sm text-muted-foreground">No other devices in Strand share a sync group with ${esc(d.name)}.</p>`,
  });
}

A.toggleGroup = (el) => {
  const bit = 1 << (Number(el.dataset.g) - 1);
  const which = el.dataset.which;
  updateDraft((d) => ({ ...d, [which]: { ...d[which], grp: d[which].grp ^ bit } }));
};
A.saveSync = async () => {
  const f = S.form;
  const id = f.key.split(":")[0];
  const fresh = await saveSection(id, "Sync settings", syncPatch(f.draft));
  if (fresh && S.form === f) {
    f.base = syncToDraft(fresh);
    f.draft = deepClone(f.base);
    render();
  }
};
/* =============================================================================
   OVERLAYS: <Dialog> / <AlertDialog>, the mobile output <Sheet>, <Toaster>,
   and the reviewer-only Prototype controls panel.
   ============================================================================= */

function Dialog({ title, description = "", body = "", actions = "", size = "max-w-lg", close = true }) {
  return `<div class="${DIALOG_OVERLAY}" data-a="overlayClick"></div>
  <div role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g, ""))}" class="${DIALOG_CONTENT.replace("max-w-lg", size)}">
    <div class="${DIALOG_HEADER}"><h2 class="${DIALOG_TITLE}">${title}</h2>${when(description, `<p class="${DIALOG_DESCRIPTION}">${description}</p>`)}</div>
    ${body}
    ${when(actions, `<div class="${DIALOG_FOOTER}">${actions}</div>`)}
    ${when(close, `<button type="button" class="${DIALOG_CLOSE}" data-a="closeModal" aria-label="Close">${icon("x")}</button>`)}
  </div>`;
}
const cancelBtn = (label = "Cancel") => `<button type="button" class="${button({ variant: "outline" })}" data-a="closeModal">${label}</button>`;

function Overlays() {
  const m = S.modal;
  if (!m) return "";
  switch (m.type) {
    case "leave":
      return Dialog({
        title: "Leave without saving?",
        description: "Your changes in this section haven't been saved and will be lost.",
        close: false,
        size: "max-w-md",
        actions: `${cancelBtn("Keep editing")}<button type="button" class="${button({ variant: "destructive" })}" data-a="leaveDiscard">Discard changes</button>`,
      });

    case "pin": {
      const cooling = m.cooldownUntil > Date.now();
      const secs = Math.ceil((m.cooldownUntil - Date.now()) / 1000);
      const name = (S.cache.devices?.data ?? []).find((d) => d.id === m.deviceId)?.name ?? "This device";
      const slot = (i) =>
        cn(
          "relative flex h-12 w-12 items-center justify-center rounded-md border border-input font-mono text-lg shadow-sm transition-all",
          i === Math.min(m.pin.length, 3) && "group-focus-within:z-10 group-focus-within:ring-2 group-focus-within:ring-ring",
          m.error && "border-danger",
        );
      return Dialog({
        title: `<span class="mb-1 flex h-10 w-10 items-center justify-center rounded-full bg-muted">${icon("lock", "size-5")}</span>Enter the settings PIN`,
        description: `${esc(name)} asks for its 4-digit PIN before settings can change.`,
        size: "max-w-sm",
        body: `<form class="flex flex-col items-center gap-3" data-submit="pinSubmit">
          <!-- InputOTP: one real input laid over four display slots -->
          <div class="group relative">
            <input id="pin-input" class="absolute inset-0 h-full w-full cursor-text opacity-0 [caret-color:transparent]" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]*" aria-label="PIN"
              value="${esc(m.pin)}" data-in="pinInput"${m.busy || cooling ? " disabled" : ""}>
            <div class="flex items-center gap-2" aria-hidden="true">${[0, 1, 2, 3].map((i) => `<div class="${slot(i)}">${m.pin[i] ? "•" : ""}</div>`).join("")}</div>
          </div>
          <p role="alert" class="min-h-5 text-center text-[13px] font-medium text-danger">${esc(m.error ?? "")}${cooling ? ` Try again in ${secs} s.` : ""}</p>
          <p class="text-center text-[13px] text-muted-foreground">Unlocking applies to the whole device for 15 minutes, for anyone on your network.</p>
          <div class="${DIALOG_FOOTER} w-full">${cancelBtn()}<button type="submit" class="${button()}"${m.pin.length !== 4 || m.busy || cooling ? " disabled" : ""}>${
            m.busy ? spinner() : ""
          }Unlock</button></div>
        </form>`,
      });
    }

    case "reboot":
      return Dialog({
        title: `Reboot ${esc(m.name)}?`,
        description: "Lights will turn off for about 10 seconds while it restarts.",
        close: false,
        size: "max-w-md",
        actions: `${cancelBtn()}<button type="button" class="${button()}" data-a="confirmReboot">Reboot</button>`,
      });

    case "remove":
      return Dialog({
        title: `Remove ${esc(m.name)} from Strand?`,
        description:
          "Nothing on the device changes. Its lights, settings and presets stay as they are, and other apps can still control it. You can add it back any time from Add device.",
        close: false,
        size: "max-w-md",
        actions: `${cancelBtn()}<button type="button" class="${button({ variant: "destructive" })}" data-a="confirmRemove"${m.busy ? " disabled" : ""}>${m.busy ? spinner() : ""}Remove</button>`,
      });

    case "confirmLed":
      return Dialog({
        title: "Save LED hardware?",
        description: "Saving re-creates the LED outputs. Segments may be adjusted to fit.",
        close: false,
        body: `<ul class="flex flex-col gap-1.5 rounded-md border bg-muted/40 p-3 text-sm tabular-nums">${m.lines
          .map((l) => `<li class="flex gap-2"><span aria-hidden="true" class="text-muted-foreground">·</span><span>${esc(l)}</span></li>`)
          .join("")}</ul>
          <p class="text-[13px] text-muted-foreground">No reboot needed. The lights may blink once.</p>`,
        actions: `${cancelBtn("Keep editing")}<button type="button" class="${button()}" data-a="confirmLedSave">Save outputs</button>`,
      });

    case "confirmReconnect":
      return Dialog({
        title: "Save and reconnect?",
        description: `Changing Wi-Fi settings may disconnect this device. If the new settings are wrong, the device opens its own access point (${esc(m.apName)}) so you can fix it.`,
        close: false,
        size: "max-w-md",
        body: when(m.alsoReboot, `<p class="text-[13px] text-muted-foreground">The new hostname or static IP takes effect after the next reboot.</p>`),
        actions: `${cancelBtn()}<button type="button" class="${button()}" data-a="confirmReconnectSave">Save &amp; reconnect</button>`,
      });

    case "confirmRebootSave":
      return Dialog({
        title: "These changes apply after a reboot",
        description: "Save now and reboot later, or reboot right away. Lights turn off for about 10 seconds while it restarts.",
        close: false,
        size: "max-w-md",
        actions: `${cancelBtn()}<button type="button" class="${button({ variant: "secondary" })}" data-a="saveNoReboot">Save</button><button type="button" class="${button()}" data-a="saveAndReboot">Save &amp; reboot</button>`,
      });

    case "scan": {
      const busy = !m.nets && !m.error;
      return Dialog({
        title: "Choose a network",
        description: "Networks this device can hear right now.",
        size: "max-w-md",
        body: `<div class="flex items-center justify-between gap-2"><span class="text-[13px] text-muted-foreground" aria-live="polite">${
          m.nets ? `${m.nets.length} networks` : busy ? "Scanning… this takes a few seconds." : ""
        }</span><button type="button" class="${button({ variant: "ghost", size: "sm" })}" data-a="rescan"${busy ? " disabled" : ""}>${icon("rotate-cw", cn("size-4", busy && "animate-spin"))}Scan again</button></div>
          ${when(m.error, `<p class="text-sm text-danger">${esc(m.error)}</p>`)}
          <ul class="-mx-2 flex flex-col">${
            m.nets
              ? m.nets
                  .map((n) => {
                    const fiveG = n.channel > 14;
                    return `<li><button type="button" class="flex min-h-12 w-full items-center gap-3 rounded-md px-2 py-2 text-left hover:bg-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-transparent" data-a="pickNet" data-ssid="${esc(
                      n.ssid,
                    )}"${fiveG ? " disabled" : ""}>
                      ${SignalBars(n.rssi)}
                      <span class="flex min-w-0 flex-1 flex-col"><span class="truncate font-medium">${esc(n.ssid)}</span>
                        <span class="text-xs tabular-nums text-muted-foreground">${fiveG ? "5 GHz · not supported by this chip" : `Channel ${n.channel} · ${n.rssi} dBm`}</span></span>
                      ${n.enc > 0 ? `<span aria-label="Secured">${icon("lock", "size-4 text-muted-foreground")}</span>` : `<span class="text-xs text-muted-foreground">Open</span>`}
                    </button></li>`;
                  })
                  .join("")
              : busy
                ? [0, 1, 2, 3].map(() => `<li class="flex items-center gap-3 px-2 py-3">${skel("h-4 flex-1")}${skel("h-4 w-12")}</li>`).join("")
                : ""
          }</ul>
          <p class="text-[13px] text-muted-foreground">Hidden network? Close this and type its name.</p>`,
      });
    }

    case "output": {
      const f = S.form;
      if (!f || !f.ui.caps) return "";
      const i = f.draft.outs.findIndex((o) => o.key === m.key);
      if (i < 0) return "";
      const errors = ledErrors(f.draft, f.ui.caps);
      const totals = ledTotals(f.draft, f.ui.caps);
      return `<div class="${DIALOG_OVERLAY}" data-a="overlayClick"></div>
      <div role="dialog" aria-modal="true" aria-label="Output ${i + 1}" class="${SHEET_BOTTOM}">
        <div class="${SHEET_HEADER}"><h2 class="text-base font-semibold">Output ${i + 1}</h2><p class="text-sm text-muted-foreground">Changes apply when you save the section.</p>
          <button type="button" class="${DIALOG_CLOSE}" data-a="closeModal" aria-label="Close">${icon("x")}</button></div>
        <div class="flex-1 overflow-y-auto p-4"><fieldset class="m-0 flex min-w-0 flex-col gap-5 border-0 p-0"${f.saving ? " disabled" : ""}>${OutputEditor(i, f, errors, totals, f.saving)}</fieldset></div>
        <div class="${SHEET_FOOTER}"><button type="button" class="${button({ className: "flex-1" })}" data-a="closeModal">Done</button></div>
      </div>`;
    }

    case "copy":
      return Dialog({
        title: "Copy this text",
        description: "Your browser blocked copying. Select the text and copy it with your keyboard, or long-press on a phone.",
        body: `<textarea readonly rows="${Math.min(12, m.text.split("\n").length + 1)}" aria-label="Text to copy" class="w-full rounded-md border bg-muted/40 p-3 font-mono text-xs">${esc(m.text)}</textarea>`,
      });
  }
  return "";
}

// ---------------------------------------------------------------------------
// <Toaster>
// ---------------------------------------------------------------------------
function Toasts() {
  return `<div role="status" aria-live="polite" class="${TOASTER}">${S.toasts
    .map(
      (t) => `<div class="${TOAST}">${icon(
        t.kind === "success" ? "circle-check" : t.kind === "error" ? "triangle-alert" : "info",
        cn("mt-0.5 size-4", t.kind === "success" ? "text-success" : t.kind === "error" ? "text-danger" : "text-muted-foreground"),
      )}<div class="min-w-0 flex-1"><p class="text-sm font-medium">${esc(t.title)}</p>${when(t.desc, `<p class="text-[13px] text-muted-foreground">${esc(t.desc)}</p>`)}</div></div>`,
    )
    .join("")}</div>`;
}

// ---------------------------------------------------------------------------
// Prototype controls (reviewer-only; not part of the product)
// ---------------------------------------------------------------------------
const SIM_STATUS = { online: "Online", offline: "Powered off", rebooting: "Rebooting", reconnecting: "Reconnecting", "ap-mode": "Stuck in AP mode" };

function PrototypePanel() {
  const sims = prototype.sims();
  const flags = prototype.flags();
  const sw = (checked, action, data, label) => `<label class="flex flex-col items-start gap-1.5 text-muted-foreground">${label}${Switch({ checked, action, data, label })}</label>`;
  return `<div class="fixed bottom-[calc(env(safe-area-inset-bottom,0px)+88px)] left-[max(16px,env(safe-area-inset-left,0px))] z-[75] flex flex-col items-start gap-2 md:bottom-[calc(env(safe-area-inset-bottom,0px)+16px)]">
    ${when(
      S.ui.proto,
      () => `<div role="dialog" aria-label="Prototype controls" class="flex max-h-[min(72dvh,640px)] w-[min(22rem,calc(100vw-32px))] flex-col overflow-hidden rounded-lg border-2 border-dashed border-primary/60 bg-popover text-popover-foreground shadow-2xl">
      <div class="flex items-center justify-between gap-2 border-b px-3 py-2">
        <div class="flex flex-col"><span class="text-sm font-semibold">Prototype controls</span><span class="text-xs text-muted-foreground">For reviewers. Not part of the app.</span></div>
        <button type="button" class="${button({ variant: "ghost", size: "icon-sm" })}" data-a="protoToggle" aria-label="Close prototype controls">${icon("x")}</button>
      </div>
      <div class="flex flex-col gap-4 overflow-y-auto p-3">
        <section class="flex flex-col gap-2"><h3 class="text-xs font-medium uppercase tracking-wider text-muted-foreground">Devices on the network</h3>
          ${sims
            .map(
              (s) => `<div class="rounded-md border p-2.5">
              <div class="mb-2 flex flex-wrap items-center gap-2"><span class="text-sm font-medium">${esc(s.name)}</span>${when(!s.added, `<span class="${badge("outline")}">Not added</span>`)}<span class="ml-auto text-xs text-muted-foreground">${SIM_STATUS[s.status]}</span></div>
              <div class="grid grid-cols-3 gap-2 text-xs">
                ${sw(s.status !== "offline" && s.status !== "ap-mode", "protoOnline", `data-mac="${s.mac}"`, "Online")}
                ${sw(s.pinLocked, "protoPin", `data-mac="${s.mac}"`, "PIN lock")}
                ${sw(s.live, "protoLive", `data-mac="${s.mac}"`, "Live data")}
              </div></div>`,
            )
            .join("")}
          <p class="text-xs text-muted-foreground">Settings PINs are 1234.</p>
        </section>
        <div class="${SEPARATOR}"></div>
        <section class="flex flex-col gap-3"><h3 class="text-xs font-medium uppercase tracking-wider text-muted-foreground">Scenarios</h3>
          <div class="flex items-center justify-between gap-3 text-sm">Next Wi-Fi save fails to reconnect${Switch({ checked: flags.failNextWifi, action: "protoFlag", data: 'data-k="failNextWifi"', label: "Next Wi-Fi save fails to reconnect" })}</div>
          <div class="flex items-center justify-between gap-3 text-sm">Discovery finds nothing${Switch({ checked: flags.discoveryEmpty, action: "protoFlag", data: 'data-k="discoveryEmpty"', label: "Discovery finds nothing" })}</div>
        </section>
        <div class="${SEPARATOR}"></div>
        <div class="flex flex-wrap gap-2">
          <button type="button" class="${button({ variant: "outline", size: "sm" })}" data-a="protoClear">${icon("trash-2")}Empty device list</button>
          <button type="button" class="${button({ variant: "outline", size: "sm" })}" data-a="protoReset">${icon("rotate-ccw")}Reset demo</button>
        </div>
      </div></div>`,
    )}
    <button type="button" class="${button({ variant: "outline", size: "sm", className: "border-dashed border-primary/60 bg-popover shadow-lg" })}" data-a="protoToggle" aria-expanded="${S.ui.proto}">${icon(
      "flask-conical",
    )}<span class="hidden md:inline">Prototype</span><span class="sr-only md:hidden">Prototype controls</span></button>
  </div>`;
}

A.closeModal = () => {
  const m = S.modal;
  if (!m) return;
  if (m.type === "pin") m.reject({ cancelled: true });
  S.modal = null;
  render();
};
A.overlayClick = (el, e) => {
  if (e.target === el) A.closeModal();
};
A.leaveDiscard = () => {
  const to = S.modal.to;
  S.modal = null;
  navigate(to, { force: true });
};
A.confirmReboot = () => {
  const { deviceId, name } = S.modal;
  S.modal = null;
  rebootDevice(deviceId, name);
};
A.confirmRemove = async () => {
  const m = S.modal;
  m.busy = true;
  render();
  try {
    await api.removeDevice(m.deviceId);
    S.modal = null;
    navigate("/", { force: true });
    toast("success", `Removed ${m.name} from Strand`);
    invalidate((k) => k === "devices");
  } catch (e) {
    m.busy = false;
    toast("error", `Couldn't remove ${m.name}`, e.message);
  }
};
A.confirmLedSave = () => doSaveLed();
A.confirmReconnectSave = () => doReconnect();
A.saveNoReboot = () => doSaveNetwork(false);
A.saveAndReboot = () => doSaveNetwork(true);

A.pinInput = (el) => {
  const m = S.modal;
  m.pin = el.value.replace(/\D/g, "").slice(0, 4);
  m.error = null;
  render();
  if (m.pin.length === 4) A.pinSubmit();
};
A.pinSubmit = async () => {
  const m = S.modal;
  if (!m || m.type !== "pin" || m.pin.length !== 4 || m.busy || m.cooldownUntil > Date.now()) return;
  m.busy = true;
  render();
  try {
    await api.unlock(m.deviceId, m.pin);
    S.modal = null;
    invalidate((k) => k === "devices");
    m.resolve();
  } catch (e) {
    m.busy = false;
    m.pin = "";
    if (e.code === "wrong_pin") {
      m.error = "That PIN didn't work.";
      m.cooldownUntil = Date.now() + 3000; // retries allowed after 3 s
      setTimeout(() => {
        if (S.modal === m) S.focus = "pin-input";
        render();
      }, 3050);
    } else m.error = e.message;
    render();
  }
};

const flip = (el) => el.getAttribute("aria-checked") !== "true";
A.protoToggle = () => {
  S.ui.proto = !S.ui.proto;
  render();
};
A.protoOnline = (el) => prototype.setOnline(el.dataset.mac, flip(el));
A.protoPin = (el) => prototype.setPinLocked(el.dataset.mac, flip(el));
A.protoLive = (el) => prototype.setLive(el.dataset.mac, flip(el));
A.protoFlag = (el) => prototype.setFlag(el.dataset.k, flip(el));
A.protoClear = () => {
  prototype.clearDevices();
  navigate("/", { force: true });
};
A.protoReset = () => {
  prototype.reset();
  S.cache = {};
  S.form = null;
  S.reconnect = null;
  S.reboot = {};
  navigate("/", { force: true });
};
/* =============================================================================
   BOOT
   ============================================================================= */
applyTheme();
prototype.subscribe(() => invalidate(isLiveKey)); // the "server" pushed a change
setInterval(() => invalidate((k) => k === "devices"), 15000); // device list refresh
matchMedia("(min-width: 900px)").addEventListener("change", (e) => {
  S.desktop = e.matches;
  render();
});
matchMedia("(prefers-color-scheme: light)").addEventListener("change", render);
// Live clocks: System uptime, reconnect timer, PIN cooldown, prototype panel status.
setInterval(() => {
  const r = route();
  if ((r.name === "device" && r.section === "system") || S.reconnect?.phase === "reconnecting" || S.modal?.type === "pin" || S.ui.proto) render();
}, 1000);
setInterval(render, 5000); // lets time-based refreshes (info every 5–10 s) kick in
render();
</script>
